    es:
      title: Condiciones de uso
      subtitle: ''
      content: "<h3>Aviso legal sobre las condiciones de uso, privacidad y protecci&oacute;n
        de datos personales del protal de participaci&oacute;n ciudadana del ayuntamiento
        de Valencia</h3>\r\n\r\n<ol>\r\n\t<li>\r\n\t<p><strong>&Aacute;mbito de aplicaci&oacute;n
        de las condiciones de uso</strong></p>\r\n\r\n\t<p>La participaci&oacute;n
        (entendi&eacute;ndola como participaci&oacute;n activa m&aacute;s all&aacute;
        de la lectura del contenido presente) en el Portal de Participaci&oacute;n
        Ciudadana del Ayuntamiento de Val&egrave;ncia se regula por las presentes
        condiciones de uso que vinculan a todas las personas que participen en este
        sitio web. Por ello, cualquier persona que desee participar deber&aacute;
        registrarse, a cuyo fin se solicitar&aacute; la aceptaci&oacute;n de estas
        condiciones de uso.</p>\r\n\r\n\t<p>El Ayuntamiento de Val&egrave;ncia se
        reserva la facultad de modificar las presentes condiciones de uso para la
        participaci&oacute;n en el Portal de Participaci&oacute;n Ciudadana del Ayuntamiento
        de Val&egrave;ncia, cuya &uacute;ltima versi&oacute;n se publicar&aacute;
        en este sitio web.</p>\r\n\r\n\t<p>El Ayuntamiento de Val&egrave;ncia se reserva
        la facultad de modificar las presentes condiciones de uso del Portal de Participaci&oacute;n
        Ciudadana del Ayuntamiento de Valencia cuya &uacute;ltima versi&oacute;n se
        publicar&aacute; en este sitio web.</p>\r\n\t</li>\r\n\t<li>\r\n\t<p><strong>Objetivo
        de la iniciativa</strong></p>\r\n\r\n\t<p>A trav&eacute;s del Portal de Participaci&oacute;n
        Ciudadana, el Ayuntamiento de Val&egrave;ncia quiere fomentar la participaci&oacute;n
        de la ciudadan&iacute;a en la gesti&oacute;n de la ciudad, implic&aacute;ndoles
        en la generaci&oacute;n de ideas y propuestas novedosas y viables, con el
        objeto de mejorar su calidad de vida. Es una apuesta decidida por una gesti&oacute;n
        m&aacute;s cercana a la ciudadan&iacute;a que permitir&aacute; recibir sus
        propuestas y adem&aacute;s, crear canales directos de comunicaci&oacute;n
        con el gobierno municipal, contribuyendo a tomar las decisiones m&aacute;s
        acertadas para el inter&eacute;s general.</p>\r\n\t</li>\r\n\t<li>\r\n\t<p><strong>Cuestiones
        generales sobre la participaci&oacute;n en el Portal de Participaci&oacute;n
        Ciudadana del Ayuntamiento de Val&egrave;ncia</strong><br />\r\n\tPodr&aacute;
        participar cualquier persona f&iacute;sica a partir de los 16 a&ntilde;os
        que se haya registrado previamente en el Portal de Participaci&oacute;n Ciudadana.
        Mediante la aceptaci&oacute;n de estas condiciones de uso se declara tener
        16 a&ntilde;os o m&aacute;s. Los mayores de edad a cuyo cargo se encuentran
        los menores, son los plenos responsables de la actuaci&oacute;n que tengan
        &eacute;stos en el Portal de Participaci&oacute;n Ciudadana. Existe una limitaci&oacute;n
        de 1 propuesta de inversi&oacute;n y 5 apoyos m&aacute;ximo que se puede presentar
        por cada participante.</p>\r\n\r\n\t<p>Al introducir el t&iacute;tulo de las
        propuestas, se recomienda escribir una descripci&oacute;n breve y precisa
        con un m&aacute;ximo de 9.000 car&aacute;cteres.</p>\r\n\t</li>\r\n</ol>\r\n\r\n<ul>\r\n\t<li>\r\n\t<p><strong>Obligaciones
        de los usuarios del Portal de Participaci&oacute;n Ciudadana</strong></p>\r\n\r\n\t<p>Al
        ser el Ayuntamiento de Val&egrave;ncia un punto de encuentro cuyo objetivo
        es debatir, y compartir y valorar propuestas relacionadas con la mejora de
        la ciudad, los usuarios est&aacute;n obligados a hacer un uso diligente y
        acorde a dicho objetivo.</p>\r\n\r\n\t<p>El Ayuntamiento de Val&egrave;ncia
        no es responsable del uso incorrecto del Portal de Participaci&oacute;n Ciudadana
        por las personas usuarias o de los contenidos localizados en el mismo, siendo
        cada persona usuaria responsable de su uso correcto y de la legalidad de los
        contenidos y opiniones que haya compartido.</p>\r\n\r\n\t<p>El Ayuntamiento
        de Val&egrave;ncia se reserva, por lo tanto, el derecho a limitar el acceso
        al Portal de Participaci&oacute;n Ciudadana del Ayuntamiento de Val&egrave;ncia
        de opiniones, informaciones, comentarios o documentos que los usuarios quieran
        incorporar, pudiendo instalar filtros a tal efecto. Todo ello se realizar&aacute;
        &uacute;nicamente mientras tenga el fin de preservar el objetivo fundamental
        del Portal de Participaci&oacute;n Ciudadana.</p>\r\n\r\n\t<p>De acuerdo a
        la normativa legal vigente queda prohibida la utilizaci&oacute;n del Portal
        de Participaci&oacute;n Ciudadana del Ayuntamiento de Val&egrave;ncia con
        fines distintos a los de debatir, compartir y valorar propuestas, y espec&iacute;ficamente:</p>\r\n\r\n\t<p>-Compartir
        cualquier contenido que pueda ser considerado como una vulneraci&oacute;n
        en cualquier forma de los derechos fundamentales al honor, imagen e intimidad
        personal y familiar de terceros o contra la dignidad de las personas.</p>\r\n\r\n\t<p>-Compartir
        im&aacute;genes o fotograf&iacute;as que recojan im&aacute;genes o datos personales
        de terceros sin haber obtenido el oportuno consentimiento de sus titulares.</p>\r\n\r\n\t<p>-Compartir
        cualquier contenido que vulnere el secreto en las comunicaciones, la infracci&oacute;n
        de derechos de propiedad industrial e intelectual o de las normas reguladoras
        de la protecci&oacute;n de datos de car&aacute;cter personal.</p>\r\n\r\n\t<p>-Reproducir,
        distribuir, compartir contenidos, informaciones o im&aacute;genes que hayan
        sido puestas a disposici&oacute;n por otras personas usuarias sin la autorizaci&oacute;n
        expresa de estos.</p>\r\n\r\n\t<p>-Su utilizaci&oacute;n con fines de publicidad.</p>\r\n\r\n\t<p>La
        realizaci&oacute;n de cualquiera de los anteriores comportamientos permitir&aacute;
        al Ayuntamiento de Val&egrave;ncia suspender temporalmente la actividad de
        una persona participante, inhabilitar su cuenta o borrar su contenido, sin
        perjuicio de otras responsabilidades que puedan ser reclamadas.</p>\r\n\r\n\t<p>En
        caso de que el contenido introducido por las personas usuarias incorpore un
        enlace a otro sitio web, el Ayuntamiento de Val&egrave;ncia no ser&aacute;
        responsable por los da&ntilde;os o perjuicios derivados del acceso al enlace
        o a sus contenidos.</p>\r\n\r\n\t<p>En caso de litigio de cualquier clase
        o por cualquier motivo entre las personas participantes en el sitio web y/o
        un tercero, el Ayuntamiento de Val&egrave;ncia quedar&aacute; exento de cualquier
        responsabilidad por reclamaciones, demandas o da&ntilde;os de cualquier naturaleza
        relacionados o derivados del litigio.</p>\r\n\t</li>\r\n</ul>\r\n\r\n<ol>\r\n\t<li>\r\n\t<p><strong>Uso
        del Portal de Participaci&oacute;n Ciudadana</strong></p>\r\n\r\n\t<p>Las
        personas participantes podr&aacute;n acceder y navegar por el Portal de Participaci&oacute;n
        Ciudadana libremente y de forma an&oacute;nima. S&oacute;lo cuando quieran
        realizar alguna acci&oacute;n que implique la creaci&oacute;n, apoyo o comentario
        de una propuesta, o a la participaci&oacute;n en un debate, se le solicitar&aacute;
        que introduzca sus credenciales, para cuya obtenci&oacute;n ser&aacute; necesario
        registrarse previamente. El registro que permitir&aacute; participar comentando
        en cualquiera de las secciones, creando debates o propuestas, se realizar&aacute;
        introduciendo los siguientes datos:</p>\r\n\r\n\t<p>&bull; Nombre de usuario</p>\r\n\r\n\t<p>&bull;
        Correo electr&oacute;nico</p>\r\n\r\n\t<p>&bull; Aceptaci&oacute;n de las
        condiciones de uso del Portal de Participaci&oacute;n Ciudadana</p>\r\n\r\n\t<p>Para
        participar apoyando propuestas, a la persona usuaria se le requerir&aacute;
        que verifique su cuenta cumpliendo que tiene 16 a&ntilde;os o m&aacute;s y
        est&aacute; empadronada en Val&egrave;ncia, para lo cual se le guiar&aacute;
        a trav&eacute;s de una serie de pasos donde se le solicitar&aacute;n datos
        relativos al padr&oacute;n y un medio de comunicaci&oacute;n a trav&eacute;s
        del cual facilitarle uno o dos c&oacute;digos seguros para completar la verificaci&oacute;n
        de su cuenta (dependiendo del medio de comunicaci&oacute;n elegido por el
        usuario).</p>\r\n\t</li>\r\n\t<li>\r\n\t<p><strong>Condiciones para el tratamiento
        de los contenidos proporcionados por las personas usuarias</strong></p>\r\n\r\n\t<p>Las
        presentes condiciones regulan los t&eacute;rminos aplicables al contenido
        remitido por las personas usuarios de esta plataforma a trav&eacute;s del
        formulario correspondiente (en adelante, el contenido). Estas condiciones
        se aplican tanto al contenido inicialmente remitido al Portal de Participaci&oacute;n
        Ciudadana como a cualquier contenido que se env&iacute;e con posterioridad
        o se manifieste al Ayuntamiento de Val&egrave;ncia, debiendo significarse
        lo siguiente:</p>\r\n\r\n\t<p>A. No Confidencialidad: Todo el contenido remitido
        por la persona usuaria al Ayuntamiento de Val&egrave;ncia deber&aacute; ser
        susceptible de ser conocido por el p&uacute;blico en general. Por lo tanto,
        el Ayuntamiento de Val&egrave;ncia tratar&aacute; el citado contenido como
        informaci&oacute;n no confidencial.</p>\r\n\r\n\t<p>B. Procedimiento: En el
        caso de que el Ayuntamiento de Val&egrave;ncia est&eacute; interesado en el
        contenido remitido por la persona usuaria, se pondr&aacute; en contacto con
        ella para solicitarle informaci&oacute;n adicional. Dicha informaci&oacute;n
        tendr&aacute; asimismo car&aacute;cter de no confidencial, sin perjuicio de
        que en el caso de que las partes consideren la necesidad de intercambiarse
        informaci&oacute;n de car&aacute;cter confidencial se firme el correspondiente
        Acuerdo de Confidencialidad.</p>\r\n\r\n\t<p>El Ayuntamiento de Val&egrave;ncia
        se reserva el derecho de no contactar con las personas usuarias que le hubieran
        remitido el contenido. Todo ello sin perjuicio de lo establecido en el apartado
        relativo a Derechos de Propiedad Intelectual e industrial.</p>\r\n\r\n\t<p>C.
        Publicidad o difusi&oacute;n de los contenidos presentados: Las personas participantes
        en el Portal de Participaci&oacute;n Ciudadana del Ayuntamiento de Val&egrave;ncia
        declaran conocer y aceptar el hecho de que la informaci&oacute;n aportada
        podr&aacute; ser publicada en la web&nbsp;<a href=\"http://www.valencia.es/\"
        target=\"_blank\">www.valencia.es</a>, as&iacute; como a trav&eacute;s de
        otros medios que la organizaci&oacute;n considere oportunos para dar a conocer
        esta iniciativa.&quot;</p>\r\n\r\n\t<p>D. No devoluci&oacute;n material: El
        Ayuntamiento de Val&egrave;ncia carece de obligaci&oacute;n alguna de devolver
        el contenido remitido por las personas usuarias.&quot;</p>\r\n\r\n\t<p>E.
        Procedimiento de aviso y retirada: El Ayuntamiento de Val&egrave;ncia procesar&aacute;
        las peticiones de eliminaci&oacute;n o retirada de contenidos que incumplan
        las condiciones de uso que hayan a&ntilde;adido las personas participantes.
        Asimismo, cualquier persona, con motivos razonados si existe incumplimiento
        de las presentes condiciones de uso, podr&aacute; solicitar la retirada de
        contenidos al Ayuntamiento de Val&egrave;ncia. El Ayuntamiento de Val&egrave;ncia
        se reserva el derecho de hacer las comprobaciones o verificaciones oportunas
        con car&aacute;cter previo a la retirada de cualquier contenido.&quot;</p>\r\n\t</li>\r\n\t<li>\r\n\t<p><strong>Pol&iacute;tica
        de privacidad y protecci&oacute;n de datos</strong></p>\r\n\r\n\t<p>A. Titularidad
        de los derechos de propiedad intelectual e industrial: La persona usuaria
        que aporta el Contenido declara, con la aceptaci&oacute;n de las presentes
        Condiciones, ser titular de los derechos de propiedad intelectual y/o industrial
        u ostentar derechos suficientes sobre dicho contenido y que adem&aacute;s
        lo remite al Ayuntamiento de Val&egrave;ncia de forma voluntaria para su divulgaci&oacute;n
        en el Portal de Participaci&oacute;n Ciudadana del Ayuntamiento de Val&egrave;ncia.</p>\r\n\r\n\t<p>La
        titularidad de todos y cada uno de los contenidos presentados que se encuentren
        protegidos o sean susceptibles de encontrarse protegidos, por el Derecho de
        la Propiedad Industrial e Intelectual, corresponde a los autores y/o titulares
        de los mencionados contenidos.</p>\r\n\r\n\t<p>El Ayuntamiento de Val&egrave;ncia
        no asume responsabilidad alguna, ya sea directa o indirecta, respecto de cualquier
        tipo de controversia, disputa y/o litigio que pudiera derivarse de la publicaci&oacute;n,
        divulgaci&oacute;n y/o difusi&oacute;n de los contenidos aportados sin el
        preceptivo consentimiento de sus leg&iacute;timos titulares.</p>\r\n\r\n\t<p>El
        Ayuntamiento de Val&egrave;ncia respetar&aacute; todos los Derechos de Propiedad
        Intelectual o Industrial sobre el contenido remitido por las personas usuarias.
        Cualquier vulneraci&oacute;n de los Derechos de Propiedad Intelectual o Industrial
        ser&aacute; responsabilidad de la persona que aporte el contenido.</p>\r\n\r\n\t<p>El
        Ayuntamiento de Val&egrave;ncia, por la mera recepci&oacute;n del contenido,
        no recibe de la persona usuaria licencia alguna de propiedad intelectual o
        industrial, por lo que no har&aacute; uso del contenido salvo aceptaci&oacute;n
        expresa de su titular.</p>\r\n\r\n\t<p>B. Protecci&oacute;n de datos: Los
        datos personales aportados por las personas usuarias que se registren en el
        Portal de Participaci&oacute;n Ciudadana, ser&aacute;n incorporados y tratados
        conforme se establece en el apartado de Pol&iacute;tica de Privacidad.</p>\r\n\r\n\t<p>El
        &oacute;rgano responsable del fichero/tratamiento es el &Aacute;rea de Descentralizaci&oacute;n
        y Participaci&oacute;n Ciudadana, ante la que la persona interesada podr&aacute;
        ejercer los derechos de acceso, rectificaci&oacute;n, cancelaci&oacute;n y
        oposici&oacute;n, todo lo cual se informa en cumplimiento del art&iacute;culo
        13 del Reglamento Europeo de Protecci&oacute;n de Datos.</p>\r\n\t</li>\r\n\t<li>\r\n\t<p><strong>Normativa
        aplicable</strong><br />\r\n\tLas normas del ordenamiento jur&iacute;dico
        espa&ntilde;ol rigen de manera exclusiva estas condiciones de uso. Cualquier
        disputa, controversia o reclamaci&oacute;n derivada de estas condiciones de
        uso, o el incumplimiento, rescisi&oacute;n o invalidaci&oacute;n de estas,
        se resolver&aacute;n exclusivamente ante los juzgados competentes.</p>\r\n\t</li>\r\n\t<li>\r\n\t<p><strong>Revisi&oacute;n
        de las condiciones de uso</strong><br />\r\n\tEl Ayuntamiento de Val&egrave;ncia
        se reserva el derecho de revisar las presentes condiciones de uso y la pol&iacute;tica
        de privacidad en cualquier momento y por cualquier raz&oacute;n. En dicho
        caso, las personas usuarias registradas ser&aacute;n avisadas a trav&eacute;s
        de este espacio en l&iacute;nea y, si contin&uacute;an utilizando el Portal
        de Participaci&oacute;n Ciudadana, se entender&aacute;n aceptadas las modificaciones
        introducidas.</p>\r\n\t</li>\r\n</ol>\r\n"
    val:
      title: Condicions d'ús
      subtitle: ''
      content: "<h3>Av&iacute;s legal sobre les condiciones d&#39;&uacute;s, privacitat
        i protecci&oacute; de dades personals del protal de participaci&oacute; ciutadana
        de l&#39;ajuntament de Val&egrave;ncia</h3>\r\n\r\n<ol>\r\n\t<li>\r\n\t<p><strong>&Agrave;mbit
        d&#39;aplicaci&oacute; de les condicions d&#39;&uacute;s</strong></p>\r\n\r\n\t<p>La
        participaci&oacute; en el Portal de Participaci&oacute; Ciutadana de l&#39;Ajuntament
        de Val&egrave;ncia (entesa com a participaci&oacute; activa m&eacute;s enll&agrave;
        de la lectura del contingut present) es regula per estes condicions d&#39;&uacute;s,
        que vinculen totes les persones que participen en este lloc web. Per aix&ograve;,
        qualsevol persona que hi vulga participar s&#39;ha de registrar amb la finalitat
        de sol&middot;licitar l&#39;acceptaci&oacute; d&#39;estes condicions d&#39;&uacute;s.</p>\r\n\r\n\t<p>L&#39;Ajuntament
        de Val&egrave;ncia es reserva la facultat de modificar estes condicions d&#39;&uacute;s
        per a participar en el Portal de Participaci&oacute; Ciutadana de l&#39;Ajuntament
        de Val&egrave;ncia, l&#39;&uacute;ltima versi&oacute; del qual es publicar&agrave;
        en este lloc web.</p>\r\n\t</li>\r\n\t<li>\r\n\t<p><strong>Objectiu de la
        iniciativa</strong></p>\r\n\r\n\t<p>A trav&eacute;s del Portal de Participaci&oacute;
        Ciutadana, l&#39;Ajuntament de Val&egrave;ncia vol fomentar la participaci&oacute;
        de la ciutadania en la gesti&oacute; de la ciutat i implicar-la en la generaci&oacute;
        d&#39;idees i propostes noves i viables, amb l&#39;objectiu de millorar-ne
        la qualitat de vida. &Eacute;s una aposta decidida per una gesti&oacute; m&eacute;s
        propera a la ciutadania, que permetr&agrave; rebre les seues propostes i,
        a m&eacute;s, crear canals directes de comunicaci&oacute; amb el govern municipal,
        per tal de contribuir a prendre les decisions m&eacute;s encertades per a
        l&#39;inter&eacute;s general.</p>\r\n\t</li>\r\n\t<li>\r\n\t<p><strong>Q&uuml;estions
        generals sobre la participaci&oacute; en el Portal de Participaci&oacute;
        Ciutadana de l&#39;Ajuntament de Val&egrave;ncia</strong></p>\r\n\r\n\t<p>Pot
        participar qualsevol persona f&iacute;sica a partir dels 16 anys que s&#39;haja
        registrat pr&egrave;viament en el Portal de Participaci&oacute; Ciutadana.
        Mitjan&ccedil;ant l&#39;acceptaci&oacute; d&#39;estes condicions d&#39;&uacute;s
        es declara tindre 16 anys o m&eacute;s. Els majors d&#39;edat a c&agrave;rrec
        dels menors s&oacute;n els plens responsables de l&#39;actuaci&oacute; que
        facen aquells en el Portal de Participaci&oacute; Ciutadana. Hi ha una limitaci&oacute;
        d&#39;una proposta d&#39;inversi&oacute; i cinc suports m&agrave;xim que pot
        presentar cada participant.</p>\r\n\r\n\t<p>En introduir el t&iacute;tol de
        les propostes, es recomana escriure&#39;n una descripci&oacute; breu i precisa
        amb un m&agrave;xim de 9.000 car&agrave;cters.</p>\r\n\t</li>\r\n\t<li>\r\n\t<p><strong>Obligacions
        dels usuaris del Portal de Participaci&oacute; Ciutadana</strong></p>\r\n\r\n\t<p>Com
        que l&#39;Ajuntament de Val&egrave;ncia &eacute;s un punt de trobada amb l&#39;objectiu
        de debatre i compartir i valorar propostes relacionades amb la millora de
        la ciutat, els usuaris estan obligats a fer un &uacute;s diligent i d&#39;acord
        amb este objectiu.</p>\r\n\r\n\t<p>L&#39;Ajuntament de Val&egrave;ncia no
        &eacute;s responsable de l&#39;&uacute;s incorrecte que puguen fer les persones
        que usen el Portal de Participaci&oacute; Ciutadana o dels continguts que
        s&#39;hi localitzen. Cada usuari &eacute;s responsable de l&#39;&uacute;s
        correcte i de la legalitat dels continguts i opinions que hi haja compartit.</p>\r\n\r\n\t<p>L&#39;Ajuntament
        de Val&egrave;ncia es reserva, per tant, el dret de limitar l&#39;acc&eacute;s
        al Portal de Participaci&oacute; Ciutadana de l&#39;Ajuntament de Val&egrave;ncia
        d&#39;opinions, informacions, comentaris o documents que els usuaris vulguen
        incorporar-hi, de manera que pot instal&middot;lar filtres a este efecte.
        Tot aix&ograve; es far&agrave; &uacute;nicament mentre tinga el fi de preservar
        l&#39;objectiu fonamental del Portal de Participaci&oacute; Ciutadana.</p>\r\n\r\n\t<p>D&#39;acord
        amb la normativa legal vigent queda prohibida la utilitzaci&oacute; del Portal
        de Participaci&oacute; Ciutadana de l&#39;Ajuntament de Val&egrave;ncia amb
        finalitats diferents a les de debatre, compartir i valorar propostes, i espec&iacute;ficament:</p>\r\n\r\n\t<p>-Compartir
        qualsevol contingut que es puga considerar una vulneraci&oacute; en qualsevol
        forma dels drets fonamentals a l&#39;honor, la imatge i la intimitat personal
        i familiar de tercers o contra la dignitat de les persones.</p>\r\n\r\n\t<p>-Compartir
        imatges o fotografies que mostren imatges o dades personals de terceres persones
        sense haver obtingut l&#39;oport&uacute; consentiment dels titulars.</p>\r\n\r\n\t<p>-Compartir
        qualsevol contingut que vulnere el secret en les comunicacions, la infracci&oacute;
        de drets de propietat industrial i intel&middot;lectual o de les normes reguladores
        de la protecci&oacute; de dades de car&agrave;cter personal.</p>\r\n\r\n\t<p>-Reproduir,
        distribuir, compartir continguts, informacions o imatges que hagen posat a
        disposici&oacute; altres persones usu&agrave;ries sense l&#39;autoritzaci&oacute;
        expressa d&#39;estos.</p>\r\n\r\n\t<p>-La utilitzaci&oacute; amb finalitats
        de publicitat.</p>\r\n\r\n\t<p>La realitzaci&oacute; de qualsevol dels comportaments
        anteriors permetr&agrave; a l&#39;Ajuntament de Val&egrave;ncia suspendre
        temporalment l&#39;activitat de participants, inhabilitar-ne el compte o esborrar-ne
        el contingut, sense perjudici d&#39;altres responsabilitats que es puguen
        reclamar.</p>\r\n\r\n\t<p>En cas que el contingut introdu&iuml;t pels usuaris
        incorpore un enlla&ccedil; a un altre lloc web, l&#39;Ajuntament de Val&egrave;ncia
        no ser&agrave; responsable pels danys o perjudicis derivats de l&#39;acc&eacute;s
        a l&#39;enlla&ccedil; o als seus continguts.</p>\r\n\r\n\t<p>En cas de litigi
        de qualsevol classe o per qualsevol motiu entre participants i/o terceres
        persones, l&#39;Ajuntament de Val&egrave;ncia quedar&agrave; exempt de qualsevol
        responsabilitat per reclamacions, demandes o danys de qualsevol naturalesa
        relacionats o derivats del litigi.</p>\r\n\t</li>\r\n\t<li>\r\n\t<p><strong>&Uacute;s
        del Portal de Participaci&oacute; Ciutadana</strong></p>\r\n\r\n\t<p>Els participants
        podran accedir i navegar pel Portal de Participaci&oacute; Ciutadana lliurement
        i de forma an&ograve;nima. Nom&eacute;s quan vulguen realitzar alguna acci&oacute;
        que implique la creaci&oacute;, el suport o el comentari d&#39;una proposta,
        o a la participaci&oacute; en un debat, se&#39;ls sol&middot;licitar&agrave;
        que introdu&iuml;squen les credencials, per a l&#39;obtenci&oacute; de les
        quals ser&agrave; necessari registrar-se pr&egrave;viament. El registre, que
        permetr&agrave; participar per a comentar en qualsevol de les seccions, crear
        debats o propostes, es far&agrave; introduint les dades seg&uuml;ents:</p>\r\n\r\n\t<p>&bull;
        Nom d&#39;usuari</p>\r\n\r\n\t<p>&bull; Adre&ccedil;a electr&ograve;nica</p>\r\n\r\n\t<p>&bull;
        Acceptaci&oacute; de les condicions d&#39;&uacute;s del Portal de Participaci&oacute;
        Ciutadana</p>\r\n\r\n\t<p>Per a participar donant suport a propostes, es requerir&agrave;
        a l&rsquo;usuari que verifique el seu compte, complisca que t&eacute; 16 anys
        o m&eacute;s i l&rsquo;empadronament a Val&egrave;ncia. Per aix&ograve; se&rsquo;l
        guiar&agrave; a trav&eacute;s d&#39;una s&egrave;rie de passos en qu&egrave;
        se sol&middot;licitaran dades relatives al padr&oacute; i un mitj&agrave;
        de comunicaci&oacute; a trav&eacute;s del qual facilitar-li un o dos codis
        segurs per a completar la verificaci&oacute; del seu compte (depenent del
        mitj&agrave; de comunicaci&oacute; que trie l&#39;usuari).</p>\r\n\t</li>\r\n\t<li>\r\n\t<p><strong>Condicions
        per al tractament dels continguts que proporcionen les persones usu&agrave;ries</strong></p>\r\n\r\n\t<p>Estes
        condicions regulen els termes aplicables al contingut que remeten les persones
        usu&agrave;ries d&#39;esta plataforma a trav&eacute;s del formulari corresponent
        (d&#39;ara endavant, el contingut). Estes condicions s&#39;apliquen tant al
        contingut inicialment rem&eacute;s al Portal de Participaci&oacute; Ciutadana
        com a qualsevol contingut que s&#39;envie amb posterioritat o es manifeste
        a l&#39;Ajuntament de Val&egrave;ncia, i cal destacar:</p>\r\n\r\n\t<p>A.
        No confidencialitat: Tot el contingut que remeta l&rsquo;usuari a l&#39;Ajuntament
        de Val&egrave;ncia ha de ser susceptible de ser conegut pel p&uacute;blic
        en general. Per tant, l&#39;Ajuntament de Val&egrave;ncia tractar&agrave;
        el contingut com a informaci&oacute; no confidencial.</p>\r\n\r\n\t<p>B. Procediment:
        En el cas que l&#39;Ajuntament de Val&egrave;ncia estiga interessat en el
        contingut rem&eacute;s per l&rsquo;usuari, hi contactar&agrave; per a sol&middot;licitar-li&rsquo;n
        informaci&oacute; addicional. Esta informaci&oacute; tindr&agrave;, aix&iacute;
        mateix, car&agrave;cter de no confidencial, sense perjudici que en el cas
        que les parts consideren la necessitat d&#39;intercanviar-se informaci&oacute;
        de car&agrave;cter confidencial se signe el corresponent acord de confidencialitat.</p>\r\n\r\n\t<p>L&#39;Ajuntament
        de Val&egrave;ncia es reserva el dret de no contactar amb els usuaris que
        hi hagen rem&eacute;s el contingut. Tot aix&ograve; sense perjudici del que
        establix l&#39;apartat relatiu a drets de propietat intel&middot;lectual i
        industrial.</p>\r\n\r\n\t<p>En el sup&ograve;sit que l&#39;Ajuntament de Val&egrave;ncia,
        a completa discreci&oacute;, decidira contactar amb determinats usuaris, estos
        coneixen i accepten que amb aix&ograve; l&#39;Ajuntament de Val&egrave;ncia
        no adquirix cap comprom&iacute;s.</p>\r\n\r\n\t<p>C. Publicitat o difusi&oacute;
        dels continguts presentats: Les persones que participen en el Portal de Participaci&oacute;
        Ciutadana de l&#39;Ajuntament de Val&egrave;ncia declaren con&eacute;ixer
        i accepten que la informaci&oacute; aportada es podr&agrave; publicar en el
        web&nbsp;<a href=\"http://www.valencia.es/\" target=\"_blank\">www.valencia.es</a>,
        aix&iacute; com a trav&eacute;s d&#39;altres mitjans que l&#39;organitzaci&oacute;
        considere oportuns per a donar a con&eacute;ixer esta iniciativa.</p>\r\n\r\n\t<p>D.
        No devoluci&oacute; material: L&#39;Ajuntament de Val&egrave;ncia no t&eacute;
        cap obligaci&oacute; de devoluci&oacute; del contingut que hi remeten els
        usuaris.</p>\r\n\r\n\t<p>E. Procediment d&#39;av&iacute;s i retirada: L&#39;Ajuntament
        de Val&egrave;ncia processar&agrave; les peticions d&#39;eliminaci&oacute;
        o retirada de continguts que incomplisquen les condicions d&#39;&uacute;s
        afegits per les persones que hi participen. Aix&iacute; mateix, qualsevol
        persona, amb motius raonats si es produ&iuml;x l&#39;incompliment de les condicions
        d&#39;&uacute;s, podr&agrave; sol&middot;licitar la retirada de continguts
        a l&#39;Ajuntament de Val&egrave;ncia. L&#39;Ajuntament de Val&egrave;ncia
        es reserva el dret de fer les comprovacions o verificacions oportunes amb
        car&agrave;cter previ a la retirada de qualsevol contingut.</p>\r\n\t</li>\r\n\t<li>\r\n\t<p><strong>Pol&iacute;tica
        de privacitat i protecci&oacute; de dades</strong></p>\r\n\r\n\t<p>A. Titularitat
        dels drets de propietat intel&middot;lectual i industrial: L&#39;usuari que
        aporta el contingut declara, amb l&#39;acceptaci&oacute; d&#39;estes condicions,
        que &eacute;s titular dels drets de propietat intel&middot;lectual i/o industrial
        o que t&eacute; drets suficients sobre este contingut i que, a m&eacute;s,
        els remet a l&#39;Ajuntament de Val&egrave;ncia de forma volunt&agrave;ria
        per a divulgar-lo en el Portal de Participaci&oacute; Ciutadana de l&#39;Ajuntament
        de Val&egrave;ncia.</p>\r\n\r\n\t<p>La titularitat de tots els continguts
        presentats que es troben protegits o siguen susceptibles de trobar-se protegits
        pel dret de la propietat industrial i intel&middot;lectual correspon als autors
        i/o titulars d&#39;estos continguts.</p>\r\n\r\n\t<p>L&#39;Ajuntament de Val&egrave;ncia
        no assumix cap responsabilitat, ja siga directa o indirecta, respecte de qualsevol
        tipus de controv&egrave;rsia, disputa i/o litigi que es puga derivar de la
        publicaci&oacute;, divulgaci&oacute; i/o difusi&oacute; dels continguts aportats
        sense el preceptiu consentiment dels titulars leg&iacute;tims.</p>\r\n\r\n\t<p>L&#39;Ajuntament
        de Val&egrave;ncia respectar&agrave; tots els drets de propietat intel&middot;lectual
        o industrial sobre el contingut que remeten els usuaris. Qualsevol vulneraci&oacute;
        dels drets de propietat intel&middot;lectual o industrial ser&agrave; responsabilitat
        de qui aporte el contingut.</p>\r\n\r\n\t<p>L&#39;Ajuntament de Val&egrave;ncia,
        per la mera recepci&oacute; del contingut, no rep dels usuaris cap llic&egrave;ncia
        de propietat intel&middot;lectual o industrial, per la qual cosa no far&agrave;
        &uacute;s del contingut excepte acceptaci&oacute; expressa dels titulars.</p>\r\n\r\n\t<p>B.
        Protecci&oacute; de dades: Les dades personals aportades pels usuaris que
        es registren en el Portal de Participaci&oacute; Ciutadana s&#39;incorporaran
        i tractaran segons establix l&#39;apartat Pol&iacute;tica de privacitat.</p>\r\n\r\n\t<p>L&#39;&ograve;rgan
        responsable del fitxer/tractament &eacute;s l&#39;&agrave;rea de Descentralitzaci&oacute;
        i Participaci&oacute; Ciutadana, davant de la qual la persona interessada
        pot exercir els drets d&#39;acc&eacute;s, rectificaci&oacute;, cancel&middot;laci&oacute;
        i oposici&oacute;. Tot aix&ograve; s&#39;informa en compliment de l&#39;article
        13 del Reglament europeu de protecci&oacute; de dades.</p>\r\n\t</li>\r\n\t<li>\r\n\t<p><strong>Normativa
        aplicable</strong><br />\r\n\tLes normes de l&#39;ordenament jur&iacute;dic
        espanyol regixen de manera exclusiva estes condicions d&#39;&uacute;s. Qualsevol
        disputa, controv&egrave;rsia o reclamaci&oacute; derivada d&#39;estes condicions
        d&#39;&uacute;s, o l&#39;incompliment, rescissi&oacute; o invalidaci&oacute;,
        es resoldran exclusivament davant els jutjats competents.</p>\r\n\t</li>\r\n\t<li>\r\n\t<p><strong>Revisi&oacute;
        de les condicions d&#39;&uacute;s</strong><br />\r\n\tL&#39;Ajuntament de
        Val&egrave;ncia es reserva el dret de revisar estes condicions d&#39;&uacute;s
        i la pol&iacute;tica de privacitat en qualsevol moment i per qualsevol ra&oacute;.
        En este cas, s&#39;avisar&agrave; els usuaris registrats a trav&eacute;s d&#39;este
        espai en l&iacute;nia i, si continuen utilitzant el Portal de Participaci&oacute;
        Ciutadana, s&#39;entendr&agrave; que accepten les modificacions introdu&iuml;des.</p>\r\n\t</li>\r\n</ol>\r\n"
