    es:
      title: Las propuestas de proyectos de inversión
      subtitle: ''
      content: "<p>Las propuestas de proyectos de inversi&oacute;n deber&aacute;n
        respetar la igualdad entre vecinas y vecinos y tener en cuenta el bien com&uacute;n.</p>\r\n\r\n<p>Se
        invita a presentar propuestas de proyectos de inversi&oacute;n para mejorar
        la calidad de vida de la ciudadan&iacute;a y/o que puedan dar respuesta a
        las principales necesidades de la poblaci&oacute;n.</p>\r\n\r\n<p>Se cuidar&aacute;
        especialmente que las propuestas de proyectos de inversi&oacute;n no vulneren
        o incrementen la situaci&oacute;n de fragilidad social de la poblaci&oacute;n
        m&aacute;s desfavorecida de la ciudad.</p>\r\n\r\n<p>Realizar una propuesta
        de proyecto es proponer algo para que el Ayuntamiento lo lleve a cabo. Hacer
        una propuesta es definir y explicar aquello que se quiere mejorar. Por ello,
        es importante pensar en el bien com&uacute;n, en la mejora del espacio p&uacute;blico,
        en la solidaridad y la convivencia, teniendo en cuenta las necesidades de
        los barrios. No hace falta que sea una descripci&oacute;n t&eacute;cnica compleja,
        pero cuanto mejor se explique y m&aacute;s concreta sea la propuesta, m&aacute;s
        f&aacute;cil ser&aacute; para el Ayuntamiento valorarla y para la ciudadan&iacute;a
        decidir votarla.</p>\r\n\r\n<h3>&iquest;Qu&eacute; es una propuesta de proyecto
        de inversi&oacute;n?</h3>\r\n\r\n<p>Las inversiones son todo aquello que el
        Ayuntamiento de Val&egrave;ncia puede construir o adquirir y que es perdurable
        en el tiempo, es decir, que su duraci&oacute;n prevista es superior a un a&ntilde;o.
        Las inversiones hacen referencia a todos los bienes inventariables de los
        cuales el Ayuntamiento puede disponer en equipamientos, infraestructuras o
        espacios p&uacute;blicos. No se consideran inversiones los gastos de mantenimiento
        o las prestaciones ordinarias de servicios que el Ayuntamiento haya de llevar
        a cabo como una de sus funciones.</p>\r\n\r\n<p>Las propuestas de proyectos
        de inversi&oacute;n han de dirigirse a cubrir objetivos de mejora de los barrios,
        tanto por intervenciones de nueva ejecuci&oacute;n como por deficiencias localizadas
        en los mismos. De manera que las inversiones pueden ser &ldquo;obras&rdquo;,
        tanto nuevas como de rehabilitaci&oacute;n de las que ya hay (por ejemplo,
        la construcci&oacute;n de un jard&iacute;n o la mejora de calles), as&iacute;
        como &ldquo;adquisiciones permanentes&rdquo; del Ayuntamiento, como por ejemplo
        la compra de contenedores de residuos.</p>\r\n\r\n<p>Se consideran proyectos
        de inversi&oacute;n objeto del proceso de presupuestos participativos, ejemplos
        como los siguientes:</p>\r\n\r\n<ol>\r\n\t<li>Rehabilitaci&oacute;n, reforma,
        ampliaci&oacute;n, adecuaci&oacute;n, mejora o dotaci&oacute;n tecnol&oacute;gica
        o de mobiliario, de equipamientos o infraestructuras p&uacute;blicas existentes.
        Ejemplo: dotaciones para bibliotecas, rehabilitaci&oacute;n de edificios municipales.</li>\r\n\t<li>Construcci&oacute;n
        de equipamientos o infraestructuras de dimensiones reducidas. Ejemplo: pistas
        deportivas de petanca, baloncesto, espacios de calistenia, zonas ajardinadas.</li>\r\n\t<li>Reurbanizaci&oacute;n
        y mejora de espacios p&uacute;blicos. Ejemplo: calles, plazas, parques y zonas
        verdes, &aacute;reas de socializaci&oacute;n de perros.</li>\r\n\t<li>Infraestructuras
        y mobiliario urbano. Ejemplo: todo tipo de mobiliario urbano (bancos, fuentes,
        papeleras), &aacute;rboles y jardineras, alumbrado, carriles bici, &aacute;reas
        de juego infantil en espacios p&uacute;blicos.</li>\r\n\t<li>Aplicaciones
        inform&aacute;ticas o infraestructura tecnol&oacute;gica. Ejemplo: Desarrollo
        de aplicaciones web.</li>\r\n</ol>\r\n\r\n<p>Las inversiones no son actividades,
        como es el caso de los programas culturales o fiestas, ni servicios, como
        podr&iacute;a ser la petici&oacute;n de mayor limpieza o de m&aacute;s personal
        para Servicios Sociales, ni tampoco subvenciones.</p>\r\n\r\n<p>No son inversiones,
        ni proyectos de inversiones objeto de este proceso:</p>\r\n\r\n<ol>\r\n\t<li>Las
        intervenciones sobre solares no municipales.</li>\r\n\t<li>El desarrollo de
        programas o proyectos como cursos, actividades culturales o de ocio, campa&ntilde;as
        de sensibilizaci&oacute;n, acontecimientos deportivos, etc&eacute;tera.</li>\r\n\t<li>La
        adquisici&oacute;n de material no inventariable (material escolar o suministros
        como energ&iacute;a).</li>\r\n\t<li>La realizaci&oacute;n de estudios o investigaciones.</li>\r\n\t<li>La
        contrataci&oacute;n de personal.</li>\r\n\t<li>La contrataci&oacute;n externa
        de empresas o aut&oacute;nomos para realizar servicios.</li>\r\n\t<li>Las
        becas, premios, convenios, subvenciones o ayudas a familias, instituciones
        sin &aacute;nimo de lucro, fundaciones o empresas privadas.</li>\r\n\t<li>El
        alquiler de equipamientos e infraestructuras (edificios, veh&iacute;culos,
        mobiliario, maquinaria).</li>\r\n\t<li>Los gastos corrientes.</li>\r\n\t<li>El
        mantenimiento, conservaci&oacute;n o limpieza de edificios, parques, veh&iacute;culos,
        mobiliario.</li>\r\n\t<li>Los proyectos que excedan los l&iacute;mites administrativos
        y el &aacute;mbito de competencias del Ayuntamiento de Val&egrave;ncia, como
        por ejemplo, la ampliaci&oacute;n del servicio de bicis al &aacute;rea metropolitana
        de Val&egrave;ncia, la intervenci&oacute;n en la red de Metro o ferrocarril
        o en las infraestructuras de acceso a Val&egrave;ncia, la ampliaci&oacute;n
        del horario del servicio de autobuses o la modificaci&oacute;n de rutas, etc&eacute;tera.</li>\r\n</ol>\r\n\r\n<h3>Requisitos
        que han de cumplir las propuestas de proyectos de inversi&oacute;n</h3>\r\n\r\n<p>Las
        propuestas de proyectos de inversi&oacute;n han de cumplir los siguientes
        requisitos:</p>\r\n\r\n<ol>\r\n\t<li>Ser competencia municipal.</li>\r\n\t<li>Ser
        claras y comprensibles.</li>\r\n\t<li>Ser viables t&eacute;cnicamente, respetar
        el marco jur&iacute;dico y legal existente y poder ser cuantificadas econ&oacute;micamente
        dentro de los l&iacute;mites econ&oacute;micos del proceso.</li>\r\n\t<li>Su
        &aacute;mbito de actuaci&oacute;n ha de ser municipal, vinculado a un distrito
        de la ciudad.</li>\r\n\t<li>Ser sostenibles econ&oacute;micamente y desde
        un punto de vista ambiental. Hay que tener en cuenta aqu&iacute; las propuestas
        cuyo mantenimiento es m&aacute;s costoso que la propia instalaci&oacute;n.
        En este caso pueden ser declaradas inviables.</li>\r\n\t<li>No ser contrarias
        a pol&iacute;ticas, programas, planes, proyectos urban&iacute;sticos aprobados
        o convenios firmados por el Ayuntamiento.</li>\r\n\t<li>No ser contrarias
        a los derechos y las libertades individuales y colectivas, ni contrarias a
        los valores democr&aacute;ticos y los derechos humanos.</li>\r\n\t<li>Los
        proyectos referentes a equipamientos han de ser coherentes con la orientaci&oacute;n
        y los usos funcionales del mismo.</li>\r\n</ol>\r\n"
    val:
      title: Les propostes de projectes d'inversió
      subtitle: ''
      content: "<p>Les propostes de projectes d&#39;inversi&oacute; hauran de respectar
        la igualtat entre ve&iuml;nes i ve&iuml;ns i tindre en compte el b&eacute;
        com&uacute;.</p>\r\n\r\n<p>Es convida a presentar propostes de projectes d&#39;inversi&oacute;
        per a millorar la qualitat de vida de la ciutadania i/o que puguen donar resposta
        a les principals necessitats de la poblaci&oacute;.</p>\r\n\r\n<p>Es cuidar&agrave;
        especialment que les propostes de projectes d&#39;inversi&oacute; no vulneren
        o incrementen la situaci&oacute; de fragilitat social de la poblaci&oacute;
        m&eacute;s desfavorida de la ciutat.</p>\r\n\r\n<p>Realitzar una proposta
        de projecte &eacute;s proposar alguna cosa perqu&egrave; l&#39;Ajuntament
        el duga a terme. Fer una proposta &eacute;s definir i explicar all&ograve;
        que es vol millorar. Per aix&ograve;, &eacute;s important pensar en el b&eacute;
        com&uacute;, en la millora de l&#39;espai p&uacute;blic, en la solidaritat
        i la conviv&egrave;ncia, tenint en compte les necessitats dels barris. No
        fa falta que siga una descripci&oacute; t&egrave;cnica complexa, per&ograve;
        quant millor s&#39;explique i m&eacute;s concreta siga la proposta, m&eacute;s
        f&agrave;cil ser&agrave; per a l&#39;Ajuntament valorar-la i per a la ciutadania
        decidir votar-la.</p>\r\n\r\n<h3>Qu&egrave; &eacute;s una proposta de projecte
        d&#39;inversi&oacute;?</h3>\r\n\r\n<p>Les inversions s&oacute;n tot all&ograve;
        que l&#39;Ajuntament de Val&egrave;ncia pot construir o adquirir i que &eacute;s
        perdurable en el temps, &eacute;s a dir, que la seua duraci&oacute; prevista
        &eacute;s superior a un any. Les inversions fan refer&egrave;ncia a tots els
        b&eacute;ns inventariables dels quals l&#39;Ajuntament pot disposar en equipaments,
        infraestructures o espais p&uacute;blics. No es consideren inversions els
        gastos de manteniment o les prestacions ordin&agrave;ries de servicis que
        l&#39;Ajuntament haja de dur a terme com una de les seues funcions.</p>\r\n\r\n<p>Les
        propostes de projectes d&#39;inversi&oacute; han de dirigir-se a cobrir objectius
        de millora dels barris, tant per intervencions de nova execuci&oacute; com
        per defici&egrave;ncies localitzades en estos. De manera que les inversions
        poden ser &ldquo;obres&rdquo;, tant noves com de rehabilitaci&oacute; de les
        quals ja hi ha (per exemple, la construcci&oacute; d&#39;un jard&iacute; o
        la millora de carrers), aix&iacute; com &ldquo;adquisicions permanents&rdquo;
        de l&#39;Ajuntament, com per exemple la compra de contenidors de residus.</p>\r\n\r\n<p>Es
        consideren projectes d&#39;inversi&oacute; objecte del proc&eacute;s de pressupostos
        participatius, exemples com els seg&uuml;ents:</p>\r\n\r\n<ol>\r\n\t<li>Rehabilitaci&oacute;,
        reforma, ampliaci&oacute;, adequaci&oacute;, millora o dotaci&oacute; tecnol&ograve;gica
        o de mobiliari d&#39;equipaments o infraestructures p&uacute;bliques existents.
        Exemple: dotacions per a biblioteques, rehabilitaci&oacute; d&#39;edificis
        municipals.</li>\r\n\t<li>Construcci&oacute; d&#39;equipaments o infraestructures
        de dimensions redu&iuml;des. Exemple: pistes esportives de petanca, b&agrave;squet,
        espais de calist&egrave;nia, zones enjardinades.</li>\r\n\t<li>Reurbanitzaci&oacute;
        i millora d&#39;espais p&uacute;blics. Exemple: carrers, places, parcs i zones
        verdes, &agrave;rees de socialitzaci&oacute; de gossos.</li>\r\n\t<li>Infraestructures
        i mobiliari urb&agrave;. Exemple: tot tipus de mobiliari urb&agrave; (bancs,
        fonts, papereres), arbres i jardineres, enllumenat, carrils bici, &agrave;rees
        de joc infantil en espais p&uacute;blics.</li>\r\n\t<li>Aplicacions inform&agrave;tiques
        o infraestructura tecnol&ograve;gica. Exemple: Desenrotllament d&#39;aplicacions
        web.</li>\r\n</ol>\r\n\r\n<p>Les inversions no s&oacute;n activitats, com
        &eacute;s el cas dels programes culturals o festes, ni servicis, com podria
        ser la petici&oacute; de major neteja o de m&eacute;s personal per a Servicis
        Socials, ni tampoc subvencions.</p>\r\n\r\n<p>No s&oacute;n inversions, ni
        projectes d&#39;inversions objecte d&#39;este proc&eacute;s:</p>\r\n\r\n<ol>\r\n\t<li>Les
        intervencions sobre solars no municipals.</li>\r\n\t<li>El desenrotllament
        de programes o projectes com a cursos, activitats culturals o d&#39;oci, campanyes
        de sensibilitzaci&oacute;, esdeveniments esportius, etc&egrave;tera.</li>\r\n\t<li>L&#39;adquisici&oacute;
        de material no inventariable (material escolar o subministraments com a energia).</li>\r\n\t<li>La
        realitzaci&oacute; d&#39;estudis o investigacions.</li>\r\n\t<li>La contractaci&oacute;
        de personal.</li>\r\n\t<li>La contractaci&oacute; externa d&#39;empreses o
        aut&ograve;noms per a realitzar servicis.</li>\r\n\t<li>Les beques, premis,
        convenis, subvencions o ajudes a fam&iacute;lies, institucions sense &agrave;nim
        de lucre, fundacions o empreses privades.</li>\r\n\t<li>El lloguer d&#39;equipaments
        i infraestructures (edificis, vehicles, mobiliari, maquin&agrave;ria).</li>\r\n\t<li>Els
        gastos corrents.</li>\r\n\t<li>El manteniment, conservaci&oacute; o neteja
        d&#39;edificis, parcs, vehicles, mobiliari.</li>\r\n\t<li>Els projectes que
        excedisquen els l&iacute;mits administratius i l&#39;&agrave;mbit de compet&egrave;ncies
        de l&#39;Ajuntament de Val&egrave;ncia, com per exemple, l&#39;ampliaci&oacute;
        del servici de bicis a l&#39;&agrave;rea metropolitana de Val&egrave;ncia,
        la intervenci&oacute; en la xarxa de metro o ferrocarril o en les infraestructures
        d&#39;acc&eacute;s a Val&egrave;ncia, l&#39;ampliaci&oacute; de l&#39;horari
        del servici d&#39;autobusos o la modificaci&oacute; de rutes, etc&egrave;tera.</li>\r\n</ol>\r\n\r\n<h3>Requisits
        que han de complir les propostes de projectes d&#39;inversi&oacute;</h3>\r\n\r\n<p>Les
        propostes de projectes d&#39;inversi&oacute; han de complir els seg&uuml;ents
        requisits:</p>\r\n\r\n<ol>\r\n\t<li>Ser compet&egrave;ncia municipal.</li>\r\n\t<li>Ser
        clares i comprensibles.</li>\r\n\t<li>Ser viables t&egrave;cnicament, respectar
        el marc jur&iacute;dic i legal existent i poder ser quantificades econ&ograve;micament
        dins dels l&iacute;mits econ&ograve;mics del proc&eacute;s.</li>\r\n\t<li>El
        seu &agrave;mbit d&#39;actuaci&oacute; ha de ser municipal, vinculat a un
        districte de la ciutat.</li>\r\n\t<li>Ser sostenibles econ&ograve;micament
        i des d&#39;un punt de vista ambiental. Cal tindre en compte ac&iacute; les
        propostes el manteniment de les quals &eacute;s m&eacute;s cost&oacute;s que
        la pr&ograve;pia instal&middot;laci&oacute;. En este cas poden ser declarades
        inviables.</li>\r\n\t<li>No ser contr&agrave;ries a pol&iacute;tiques, programes,
        plans, projectes urban&iacute;stics aprovats o convenis firmats per l&#39;Ajuntament.</li>\r\n\t<li>No
        ser contr&agrave;ries als drets i les llibertats individuals i col&middot;lectives,
        ni contr&agrave;ries als valors democr&agrave;tics i els drets humans.</li>\r\n\t<li>Els
        projectes referents a equipaments han de ser coherents amb l&#39;orientaci&oacute;
        i els usos funcionals d&#39;este.</li>\r\n</ol>\r\n"
