  translations:
    es:
      title: Política de privacidad
      subtitle: ''
      content: "<h3>Aviso de protecci&oacute;n de datos</h3>\r\n\r\n<ol>\r\n\t<li>\r\n\t<p>La
        navegaci&oacute;n por la informaci&oacute;n disponible en el Portal de Participaci&oacute;n
        Ciudadana del Ayuntamiento de Val&egrave;ncia es an&oacute;nima.</p>\r\n\t</li>\r\n\t<li>\r\n\t<p>Para
        utilizar los servicios contenidos en el Portal de Participaci&oacute;n Ciudadana
        del Ayuntamiento de Val&egrave;ncia la persona usuaria deber&aacute; darse
        de alta y proporcionar previamente los datos de car&aacute;cter personal seg&uacute;n
        la informaci&oacute;n espec&iacute;fica que consta en cada tipo de alta.</p>\r\n\t</li>\r\n\t<li>\r\n\t<p>Los
        datos aportados ser&aacute;n tratados por el Ayuntamiento de Val&egrave;ncia
        de acuerdo con la descripci&oacute;n GESTI&Oacute;N DE PROCESOS PARTICIPATIVOS</p>\r\n\t</li>\r\n\t<li>\r\n\t<p>Finalidad
        del fichero/tratamiento: Gestionar los procesos para el control de la habilitaci&oacute;n
        de las personas que participan en el mismo y recuento meramente num&eacute;rico
        y estad&iacute;stico de los resultados derivados de los procesos de participaci&oacute;n
        ciudadana y el resto de actividad.</p>\r\n\t</li>\r\n\t<li>\r\n\t<p>Legitimidad
        del tratamiento: La base legal del tratamiento es el art. 6.1, c) y e) RGPD
        2016/679 (obligaci&oacute;n legal e inter&eacute;s p&uacute;blico) y la Ley
        7/85, de 2 de abril, Reguladora de las Bases de R&eacute;gimen Local (art&iacute;culo
        69) y la Ley 8/2010, de 23 de junio, de r&eacute;gimen local de la Comunitat
        Valenciana (art&iacute;culos 137 y ss.).</p>\r\n\t</li>\r\n\t<li>\r\n\t<p>Responsable
        del Tratamiento:<br />\r\n\tIdentidad: Ayuntamiento de Val&egrave;ncia<br
        />\r\n\tDirecci&oacute;n: Pla&ccedil;a de l&#39;Ajuntament, 1, 46002 Val&egrave;ncia<br
        />\r\n\tTel&eacute;fono: 963 52 54 78<br />\r\n\t&Oacute;rgano Gestor: &Aacute;rea
        de Descentralizaci&oacute;n y Participaci&oacute;n Ciudadana (C/ Amadeo de
        Saboya 11, 46010 Val&egrave;ncia)<br />\r\n\tContacto de la Delegaci&oacute;n
        de Protecci&oacute;n de Datos (DPD):&nbsp;<a href=\"mailto:oficinadpd@valencia.es\"
        target=\"_blank\">oficinadpd@valencia.es</a></p>\r\n\t</li>\r\n\t<li>\r\n\t<p>Plazo
        de Conservaci&oacute;n: Los datos personales proporcionados se conservar&aacute;n
        mientras se desarrollen los procesos participativos del Ayuntamiento de Val&egrave;ncia
        y siempre que no solicite su supresi&oacute;n, su conservaci&oacute;n lo ser&aacute;
        a los meros efectos de archivo al amparo del Reglamento (UE) 2016/679 del
        Parlamento Europeo y del Consejo sobre protecci&oacute;n de datos de car&aacute;cter
        personal y dem&aacute;s disposiciones de aplicaci&oacute;n. Una vez solicitada
        la supresi&oacute;n de los datos, se mantendr&aacute;n bloqueados durante
        el tiempo necesario, y limitando su tratamiento, &uacute;nicamente para alguno
        de estos supuestos: cumplir con las obligaciones legales de cualquier tipo
        a que estemos sometidos y/o durante los plazos legales previstos para la prescripci&oacute;n
        de cualesquiera responsabilidades por nuestra parte y/o el ejercicio o la
        defensa de reclamaciones derivadas de la relaci&oacute;n mantenida con la
        persona usuaria.</p>\r\n\t</li>\r\n\t<li>\r\n\t<p>Derechos de la persona usuaria:</p>\r\n\r\n\t<ul>\r\n\t\t<li>\r\n\t\t<p>Tiene
        derecho a&nbsp;<strong>obtener confirmaci&oacute;n&nbsp;</strong>sobre si
        en el Ayuntamiento de Val&egrave;ncia se est&aacute;n tratando datos personales
        que le conciernen, o no.</p>\r\n\t\t</li>\r\n\t\t<li>\r\n\t\t<p>Podr&aacute;&nbsp;<strong>acceder
        a sus datos</strong>&nbsp;personales, as&iacute; como solicitar la&nbsp;<strong>rectificaci&oacute;n</strong>&nbsp;de
        los que sean inexactos o, en su caso, solicitar su&nbsp;<strong>supresi&oacute;n</strong>&nbsp;cuando,
        entre otros motivos, los datos ya no sean necesarios para los fines que fueron
        recogidos.</p>\r\n\t\t</li>\r\n\t\t<li>\r\n\t\t<p>En determinadas circunstancias
        podr&aacute; solicitar la&nbsp;<strong>limitaci&oacute;n del tratamiento</strong>&nbsp;de
        sus datos, en cuyo caso &uacute;nicamente se conservar&aacute;n para el ejercicio
        o la defensa de reclamaciones.</p>\r\n\t\t</li>\r\n\t\t<li>\r\n\t\t<p>En determinadas
        circunstancias y por motivos relacionados con su situaci&oacute;n particular,
        podr&aacute;&nbsp;<strong>oponerse</strong>&nbsp;al tratamiento de sus datos.
        En dichos supuestos el Ayuntamiento de Val&egrave;ncia dejar&aacute; de tratar
        los mismos, salvo por motivos leg&iacute;timos imperiosos, o el ejercicio
        o la defensa de posibles reclamaciones.</p>\r\n\t\t</li>\r\n\t\t<li>\r\n\t\t<p>Para
        ejercitar sus derechos podr&aacute; formular una solicitud ante cualquiera
        de los&nbsp;<a href=\"http://www.valencia.es/ayuntamiento/infociudad_accesible.nsf/vDocumentosWebListado/490749D99173471CC12572C200242DD2?OpenDocument&amp;lang=1\"
        target=\"_blank\">puntos de registro de entrada</a>del ayuntamiento, ante
        la&nbsp;<a href=\"https://sede.valencia.es/sede/?lang=1\" target=\"_blank\">sede
        electr&oacute;nica</a>&nbsp;del mismo, as&iacute; como en la direcci&oacute;n
        de correo electr&oacute;nico&nbsp;<a href=\"mailto:oficinadpd@valencia.es\"
        target=\"_blank\">oficinadpd@valencia.es</a>.</p>\r\n\t\t</li>\r\n\t\t<li>\r\n\t\t<p>Podr&aacute;,
        igualmente, formular reclamaciones ante la&nbsp;<a href=\"https://www.aepd.es/reglamento/derechos/\"
        target=\"_blank\">Agencia Espa&ntilde;ola de Protecci&oacute;n de datos</a>.</p>\r\n\t\t</li>\r\n\t</ul>\r\n\t</li>\r\n</ol>\r\n"
    val:
      title: Política de privacitat
      subtitle: ''
      content: "<h3>Av&iacute;s de protecci&oacute; de dades</h3>\r\n\r\n<ol>\r\n\t<li>\r\n\t<p>La
        navegaci&oacute; per la informaci&oacute; disponible en el Portal de Participaci&oacute;
        Ciutadana de l&#39;Ajuntament de Val&egrave;ncia &eacute;s an&ograve;nima.</p>\r\n\t</li>\r\n\t<li>\r\n\t<p>Per
        a utilitzar els servicis del Portal de Participaci&oacute; Ciutadana de l&#39;Ajuntament
        de Val&egrave;ncia els usuaris s&#39;ha de donar d&#39;alta i proporcionar
        pr&egrave;viament les dades de car&agrave;cter personal segons la informaci&oacute;
        espec&iacute;fica que consta en cada tipus d&#39;alta.</p>\r\n\t</li>\r\n\t<li>\r\n\t<p>Les
        dades aportades les tractar&agrave; l&#39;Ajuntament de Val&egrave;ncia d&#39;acord
        amb la descripci&oacute;&nbsp;<em>Gesti&oacute; de processos participatius</em>.</p>\r\n\t</li>\r\n\t<li>\r\n\t<p>Finalitat
        del fitxer/tractament: Gestionar els processos per al control de l&#39;habilitaci&oacute;
        de les persones que hi participen i el recompte merament num&egrave;ric i
        estad&iacute;stic dels resultats derivats dels processos de participaci&oacute;
        ciutadana i la resta d&#39;activitat.</p>\r\n\t</li>\r\n\t<li>\r\n\t<p>Legitimitat
        del tractament: La base legal del tractament &eacute;s l&#39;article 6.1,
        lletres c i e, del RGPD 2016/679 (obligaci&oacute; legal i inter&eacute;s
        p&uacute;blic); la Llei 7/85, de 2 d&#39;abril, reguladora de les bases del
        r&egrave;gim local (article 69), i la Llei 8/2010, de 23 de juny, de r&egrave;gim
        local de la Comunitat Valenciana (articles 137 i seg&uuml;ents).</p>\r\n\t</li>\r\n\t<li>\r\n\t<p>Responsable
        del tractament:<br />\r\n\tIdentitat: Ajuntament de Val&egrave;ncia<br />\r\n\tAdre&ccedil;a:
        Pla&ccedil;a de l&#39;Ajuntament, 1, 46002 Val&egrave;ncia<br />\r\n\tTel&egrave;fon:
        963 52 54 78<br />\r\n\t&Ograve;rgan gestor: &Agrave;rea de Descentralitzaci&oacute;
        i Participaci&oacute; Ciutadana (c/ Amadeu de Savoia 11, 46010 Val&egrave;ncia)<br
        />\r\n\tContacte de la Delegaci&oacute; de Protecci&oacute; de Dades (DPD):&nbsp;<a
        href=\"mailto:oficinadpd@valencia.es\" target=\"_blank\">oficinadpd@valencia.es</a></p>\r\n\t</li>\r\n\t<li>\r\n\t<p>Termini
        de conservaci&oacute;: Les dades personals proporcionades es conservaran mentre
        es desenvolupen els processos participatius de l&#39;Ajuntament de Val&egrave;ncia
        i, sempre que no se&#39;n sol&middot;licite la supressi&oacute;, la conservaci&oacute;
        ser&agrave; als mers efectes d&#39;arxiu, a l&#39;empara del Reglament (UE)
        2016/679, del Parlament Europeu i del Consell, sobre protecci&oacute; de dades
        de car&agrave;cter personal i altres disposicions d&#39;aplicaci&oacute;.
        Despr&eacute;s de sol&middot;licitar la supressi&oacute; de les dades, es
        mantindran bloquejades durant el temps necessari i limitant-ne el tractament
        nom&eacute;s per a algun d&#39;estos sup&ograve;sits: complir amb les obligacions
        legals de qualsevol tipus a qu&egrave; estiguem sotmesos i/o durant els terminis
        legals prevists per a la prescripci&oacute; de qualssevol responsabilitats
        per la nostra banda i/o l&#39;exercici o la defensa de reclamacions derivades
        de la relaci&oacute; mantinguda amb els usuaris.</p>\r\n\t</li>\r\n\t<li>\r\n\t<p>Drets
        dels usuaris:</p>\r\n\r\n\t<ul>\r\n\t\t<li>\r\n\t\t<p>T&eacute; dret a&nbsp;<strong>obtindre
        la confirmaci&oacute;</strong>&nbsp;sobre si a l&#39;Ajuntament de Val&egrave;ncia
        s&#39;estan tractant dades personals que l&#39;afecten o no.</p>\r\n\t\t</li>\r\n\t\t<li>\r\n\t\t<p>Pot&nbsp;<strong>accedir
        a les seues dades</strong>&nbsp;personals, demanar la&nbsp;<strong>rectificaci&oacute;</strong>&nbsp;de
        les que siguen inexactes o, si &eacute;s el cas, sol&middot;licitar-ne la&nbsp;<strong>supressi&oacute;</strong>&nbsp;quan,
        entre altres motius, les dades ja no siguen necess&agrave;ries per a les finalitats
        que es van recollir.</p>\r\n\t\t</li>\r\n\t\t<li>\r\n\t\t<p>En determinades
        circumst&agrave;ncies pot sol&middot;licitar la&nbsp;<strong>limitaci&oacute;
        del tractament</strong>&nbsp;de les seues dades. En este sup&ograve;sit nom&eacute;s
        es conservaran per a l&#39;exercici o la defensa de reclamacions.</p>\r\n\t\t</li>\r\n\t\t<li>\r\n\t\t<p>En
        determinades circumst&agrave;ncies i per motius relacionats amb la situaci&oacute;
        particular, pot&nbsp;<strong>oposar-se</strong>&nbsp;al tractament de les
        seues dades. En eixos sup&ograve;sits l&#39;Ajuntament de Val&egrave;ncia
        deixar&agrave; de tractar-les, excepte per motius leg&iacute;tims imperiosos
        o l&#39;exercici o la defensa de possibles reclamacions.</p>\r\n\t\t</li>\r\n\t\t<li>\r\n\t\t<p>Per
        a exercitar els seus drets pot formular una sol&middot;licitud en qualsevol
        dels&nbsp;<a href=\"http://www.valencia.es/ayuntamiento/infociudad_accesible.nsf/vDocumentosWebListado/490749D99173471CC12572C200242DD2?OpenDocument&amp;lang=2\"
        target=\"_blank\">punts de registre d&#39;entrada</a>&nbsp;de l&#39;Ajuntament,
        en la seua&nbsp;<a href=\"https://sede.valencia.es/sede/?lang=2\" target=\"_blank\">seu
        electr&ograve;nica</a>&nbsp;o en l&#39;adre&ccedil;a de correu electr&ograve;nic&nbsp;<a
        href=\"mailto:oficinadpd@valencia.es\" target=\"_blank\">oficinadpd@valencia.es</a>.</p>\r\n\t\t</li>\r\n\t\t<li>\r\n\t\t<p>Pot
        igualment formular reclamacions davant l&#39;Ag&egrave;ncia&nbsp;<a href=\"https://www.aepd.es/reglamento/derechos/\"
        target=\"_blank\">Espanyola de Protecci&oacute; de Dades</a>.</p>\r\n\t\t</li>\r\n\t</ul>\r\n\t</li>\r\n</ol>\r\n"
