    es:
      title: "¿Qué es VLCParticipa?"
      subtitle: ''
      content: "<p>VLCParticipa es un proyecto basado en presupuestos participativos
        de inversiones que pone de manifiesto el compromiso y la voluntad del Ayuntamiento
        de Valencia por incrementar la colaboraci&oacute;n y la participaci&oacute;n
        de la ciudadan&iacute;a en la toma de decisiones sobre la gesti&oacute;n municipal.
        Es un proceso de participaci&oacute;n ciudadana en el que la ciudadan&iacute;a
        decide de manera directa a qu&eacute; se destina una parte del presupuesto
        municipal.</p>\r\n\r\n<p>VLCParticipa nace como demanda a escuchar a la ciudadan&iacute;a
        y tiene el reto de realizar el gran esfuerzo de ejecutar las propuestas de
        proyectos de inversiones pendientes.</p>\r\n\r\n<p>VLCParticipa pretende simplificar
        a la ciudadan&iacute;a la forma de proponer y participar en proyectos de inversi&oacute;n,
        y facilitarles la participaci&oacute;n presencial, as&iacute; como realizar
        una mayor difusi&oacute;n y acceso.</p>\r\n\r\n<p>VLCParticipa es un instrumento
        de participaci&oacute;n promovido por la Concejal&iacute;a de Recursos Humanos
        y T&eacute;cnicos, Participaci&oacute;n, Acci&oacute;n Vecinal y Pedan&iacute;as
        del Ayuntamiento de Val&egrave;ncia, con el que la ciudadan&iacute;a va a
        poder proponer, apoyar y votar proyectos de inversi&oacute;n a ejecutar en
        los diferentes barrios y/o distritos de la ciudad. Se presentan propuestas,
        se recogen los apoyos recibidos por cada una de ellas, se analiza la viabilidad
        t&eacute;cnica de las propuestas m&aacute;s respaldadas y, por &uacute;ltimo,
        se someten a votaci&oacute;n. Finalizado este proceso, el Ayuntamiento ejecutar&aacute;
        los proyectos m&aacute;s votados por la ciudadan&iacute;a.</p>\r\n\r\n<p>Es
        un proceso que invita a participar e incorporar las propuestas y opiniones
        de la ciudadan&iacute;a en la gesti&oacute;n municipal a la hora de definir
        el destino de una parte de los recursos p&uacute;blicos municipales de inversiones.</p>\r\n\r\n<h3>Calendario
        y fases</h3>\r\n\r\n<p>Las principales fases de VLCParticipa son las siguientes:</p>\r\n\r\n<p><strong>1.
        Presentaci&oacute;n de propuestas</strong><br />\r\nDel 29 de abril al 31
        de mayo</p>\r\n\r\n<p>Las propuestas de proyectos se presentar&aacute;n de
        manera telem&aacute;tica a trav&eacute;s de la web.</p>\r\n\r\n<p>Durante
        esta fase cualquier persona mayor de 16 a&ntilde;os empadronada en Valencia
        podr&aacute; presentar propuestas. Las propuestas podr&aacute;n presentarse
        de manera individual, esto es, en nombre propio, por cualquier persona mayor
        de 16 a&ntilde;os o bien de manera colectiva, en representaci&oacute;n de
        alguna entidad.</p>\r\n\r\n<p>En este segundo supuesto, deber&aacute; designarse
        una persona f&iacute;sica a efectos de hacer posibles las comunicaciones electr&oacute;nicas
        entre Ayuntamiento de Valencia y la persona proponente, debiendo estar la
        entidad inscrita en el Registro Municipal de Entidades Ciudadanas. Los vecinos
        y vecinas podr&aacute;n presentar hasta 3 propuestas de inversi&oacute;n.
        Los Grupos de Trabajo de las Juntas Municipales de Distrito tendr&aacute;n
        la posibilidad de presentar hasta 5.</p>\r\n\r\n<p><strong>2. Apoyo a las
        propuestas</strong><br />\r\nDel 1 al 22 de junio</p>\r\n\r\n<p>En esta fase,
        las personas mayores de 16 a&ntilde;os empadronadas en Valencia podr&aacute;n
        otorgar su apoyo a aquellas propuestas que consideren oportunas por su relevancia
        o necesidad.</p>\r\n\r\n<p><strong>3.Tiempo de validaci&oacute;n</strong><br
        />\r\nDel 23 de junio al 9 de octubre</p>\r\n\r\n<p>Los servicios t&eacute;cnicos
        competentes del Ayuntamiento seg&uacute;n la materia, realizar&aacute;n un
        estudio de viabilidad de las propuestas que hayan superado la fase anterior.
        Se emitir&aacute; un informe de cada propuesta, de forma individual o agrupando
        varias propuestas, indicando la viabilidad o inviabilidad justificada de la
        misma y el presupuesto estimado en caso de viabilidad.</p>\r\n\r\n<p><strong>4.
        Votaci&oacute;n ciudadana</strong><br />\r\nDel 10 de octubre al 7 de noviembre</p>\r\n\r\n<p>Todas
        las personas mayores de 16 a&ntilde;os empadronadas en Valencia podr&aacute;n
        votar los distintos proyectos en funci&oacute;n del presupuesto asignado.</p>\r\n\r\n<p><img
        alt=\"Calendario con semanas coloreadas según las cuatro fases\" src=\"consul-seed://blob/4w4utk6hu7lti64pgurizok6t7z1?variant=eyJmb3JtYXQiOiJwbmciLCJyZXNpemUiOiI4MDBcdTAwM2UifQ\"
        style=\"width: 800px; height: 380px;\" /></p>\r\n\r\n<h3>&iquest;C&oacute;mo
        participar en los Presupuestos Participativos de Inversiones?</h3>\r\n\r\n<p>Las
        vecinas y los vecinos de la ciudad pueden participar de las siguientes maneras:</p>\r\n\r\n<ol>\r\n\t<li>Proponiendo
        proyectos de inversi&oacute;n</li>\r\n\t<li>Apoyando los proyectos presentados</li>\r\n\t<li>Votando</li>\r\n</ol>\r\n\r\n<h3>Distribuci&oacute;n
        presupuestaria de las propuestas de inversi&oacute;n</h3>\r\n\r\n<p>El presupuesto
        vinculado a VLCParticipa se destinar&aacute; a realizar proyectos de inversi&oacute;n
        localizados en los distritos de la ciudad de Valencia, por lo que cada distrito
        tendr&aacute; asignada una cuant&iacute;a presupuestaria, repartida seg&uacute;n
        criterios de poblaci&oacute;n e indicadores socioecon&oacute;micos, seg&uacute;n
        la informaci&oacute;n de la Oficina Municipal de Estad&iacute;stica.</p>\r\n\r\n<p>El
        c&aacute;lculo de la distribuci&oacute;n de los presupuestos se ha realizado
        asignando una cantidad inicial fija a cada uno de los distritos y aplicando
        criterios de poblaci&oacute;n (n&uacute;mero de personas empadronadas y renta).</p>\r\n\r\n<table>\r\n\t<thead>\r\n\t\t<tr>\r\n\t\t\t<th>\r\n\t\t\t<p>Distrito</p>\r\n\t\t\t</th>\r\n\t\t\t<th>\r\n\t\t\t<p>Presupuesto</p>\r\n\t\t\t</th>\r\n\t\t</tr>\r\n\t</thead>\r\n\t<tbody>\r\n\t\t<tr>\r\n\t\t\t<td>\r\n\t\t\t<p>Ciutat
        Vella</p>\r\n\t\t\t</td>\r\n\t\t\t<td>395.154</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>\r\n\t\t\t<p>l&#39;Eixample</p>\r\n\t\t\t</td>\r\n\t\t\t<td>485.894</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>\r\n\t\t\t<p>Extramurs</p>\r\n\t\t\t</td>\r\n\t\t\t<td>640.588</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>\r\n\t\t\t<p>Campanar</p>\r\n\t\t\t</td>\r\n\t\t\t<td>623.387</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>\r\n\t\t\t<p>la
        Sa&iuml;dia</p>\r\n\t\t\t</td>\r\n\t\t\t<td>921.957</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>\r\n\t\t\t<p>el
        Pla del Real</p>\r\n\t\t\t</td>\r\n\t\t\t<td>380.571</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>\r\n\t\t\t<p>l&#39;Olivereta</p>\r\n\t\t\t</td>\r\n\t\t\t<td>1.183.678</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>\r\n\t\t\t<p>Patraix</p>\r\n\t\t\t</td>\r\n\t\t\t<td>1.012.058</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>\r\n\t\t\t<p>Jes&uacute;s</p>\r\n\t\t\t</td>\r\n\t\t\t<td>1.157.550</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>\r\n\t\t\t<p>Quatre
        Carreres</p>\r\n\t\t\t</td>\r\n\t\t\t<td>1.475.031</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>\r\n\t\t\t<p>Poblats
        Mar&iacute;tims</p>\r\n\t\t\t</td>\r\n\t\t\t<td>1.205.469</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>\r\n\t\t\t<p>Camins
        al Grau</p>\r\n\t\t\t</td>\r\n\t\t\t<td>1.098.609</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>\r\n\t\t\t<p>Algir&oacute;s</p>\r\n\t\t\t</td>\r\n\t\t\t<td>586.341</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>\r\n\t\t\t<p>Benimaclet</p>\r\n\t\t\t</td>\r\n\t\t\t<td>510.618</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>\r\n\t\t\t<p>Rascanya</p>\r\n\t\t\t</td>\r\n\t\t\t<td>1.256.663</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>\r\n\t\t\t<p>Benicalap</p>\r\n\t\t\t</td>\r\n\t\t\t<td>1.103.863</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>\r\n\t\t\t<p>Pobles
        del Nord</p>\r\n\t\t\t</td>\r\n\t\t\t<td>373.506</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>\r\n\t\t\t<p>Pobles
        de l&#39;Oest</p>\r\n\t\t\t</td>\r\n\t\t\t<td>692.676</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>\r\n\t\t\t<p>Pobles
        del Sud</p>\r\n\t\t\t</td>\r\n\t\t\t<td>896.387</td>\r\n\t\t</tr>\r\n\t</tbody>\r\n</table>\r\n\r\n<h3>Compromiso
        del Gobierno Municipal</h3>\r\n\r\n<p>El Gobierno Municipal se compromete
        a llevar a cabo la ejecuci&oacute;n de dicho gasto teniendo en cuenta los
        resultados de VLCParticipa, siempre que se atienda a los criterios t&eacute;cnicos
        de viabilidad de los proyectos y a los l&iacute;mites econ&oacute;micos disponibles.
        De esta forma, los compromisos asumidos se concretan en:</p>\r\n\r\n<ol>\r\n\t<li>Informar
        y asesorar a la ciudadan&iacute;a sobre todo el proceso de VLCParticipa, las
        propuestas presentadas y la forma de apoyarlas y votarlas.</li>\r\n\t<li>Convertir
        en proyectos las propuestas ciudadanas aprobadas.</li>\r\n\t<li>Por parte
        del Servicio responsable de la ejecuci&oacute;n de cada propuesta, dotar de
        presupuesto a las propuestas que se le asignen y, en su caso, realizar la
        previsi&oacute;n del presupuesto necesario para los ejercicios siguientes
        hasta su finalizaci&oacute;n.</li>\r\n\t<li>Facilitar el seguimiento de la
        ejecuci&oacute;n de las propuestas a trav&eacute;s de la plataforma web.</li>\r\n\t<li>Incluir
        los proyectos ganadores en el anteproyecto del Presupuesto General del Ayuntamiento
        de Valencia.</li>\r\n</ol>\r\n"
    val:
      title: Què és VLCParticipa?
      subtitle: ''
      content: "<p>VLCParticipa &eacute;s un projecte basat en pressupostos participatius
        d&#39;inversions que posa de manifest el comprom&iacute;s i la voluntat de
        l&#39;Ajuntament de Val&egrave;ncia per incrementar la col&middot;laboraci&oacute;
        i la participaci&oacute; de la ciutadania en la presa de decisions sobre la
        gesti&oacute; municipal. &Eacute;s un proc&eacute;s de participaci&oacute;
        ciutadana en el qual la ciutadania decideix de manera directa a qu&egrave;
        es destina una part del pressupost municipal.</p>\r\n\r\n<p>VLCParticipa naix
        com a demanda a escoltar la ciutadania i t&eacute; el repte de fer el gran
        esfor&ccedil; d&#39;executar les propostes de projectes d&#39;inversions pendents.</p>\r\n\r\n<p>VLCParticipa
        pret&eacute;n simplificar a la ciutadania la manera de proposar i participar
        en projectes d&#39;inversi&oacute;, i facilitar-los la participaci&oacute;
        presencial, aix&iacute; com realitzar una major difusi&oacute; i acc&eacute;s.</p>\r\n\r\n<p>VLCParticipa
        &eacute;s un instrument de participaci&oacute; promogut per la Regidoria de
        Recursos Humans i T&egrave;cnics, Participaci&oacute;, Acci&oacute; Ve&iuml;nal
        i Pedanies de l&#39;Ajuntament de Val&egrave;ncia, amb el qual la ciutadania
        podr&agrave; proposar, secundar i votar projectes d&#39;inversi&oacute; a
        executar en els diferents barris i/o districtes de la ciutat. Es presenten
        propostes, s&#39;arrepleguen els suports rebuts per cada una d&#39;elles,
        s&#39;analitza la viabilitat t&egrave;cnica de les propostes m&eacute;s recolzades
        i, finalment, se sotmeten a votaci&oacute;. Finalitzat aquest proc&eacute;s,
        l&#39;Ajuntament executar&agrave; els projectes m&eacute;s votats per la ciutadania.</p>\r\n\r\n<p>&Eacute;s
        un proc&eacute;s que convida a participar i incorporar les propostes i opinions
        de la ciutadania en la gesti&oacute; municipal a l&#39;hora de definir el
        dest&iacute; d&#39;una part dels recursos p&uacute;blics municipals d&#39;inversions.</p>\r\n\r\n<h3>Calendari
        i fases</h3>\r\n\r\n<p><strong>1. Presentaci&oacute; de propostes</strong><br
        />\r\nDel 29 d&#39;abril al 31 de maig</p>\r\n\r\n<p>Les propostes de projectes
        es presentaran de manera telem&agrave;tica a trav&eacute;s de la web.</p>\r\n\r\n<p>Durant
        esta fase qualsevol persona major de 16 anys empadronada a Val&egrave;ncia
        podr&agrave; presentar propostes. Les propostes podran presentar-se de manera
        individual, aix&ograve; &eacute;s, en nom propi, per qualsevol persona major
        de 16 anys o b&eacute; de manera col&middot;lectiva, en representaci&oacute;
        d&#39;alguna entitat.</p>\r\n\r\n<p>En este segon suposat, haur&agrave; de
        designar-se una persona f&iacute;sica a l&#39;efecte de fer possibles les
        comunicacions electr&ograve;niques entre Ajuntament de Val&egrave;ncia i la
        persona proponent, havent d&#39;estar l&#39;entitat inscrita en el Registre
        Municipal d&#39;Entitats Ciutadanes. Els ve&iuml;ns i ve&iuml;nes podran presentar
        fins a 3 propostes d&#39;inversi&oacute;. Els Grups de Treball de les Juntes
        Municipals de Districte tindran la possibilitat de presentar fins a 5.</p>\r\n\r\n<p><strong>2.
        Suport a les propostes</strong><br />\r\nDe l&#39;1 al 22 de juny</p>\r\n\r\n<p>En
        esta fase, les persones majors de 16 anys empadronades a Val&egrave;ncia podran
        atorgar el seu suport a aquelles propostes que consideren oportunes per la
        seua rellev&agrave;ncia o necessitat.</p>\r\n\r\n<p><strong>3.Temps de validaci&oacute;</strong><br
        />\r\nDel 23 de juny al 9 d&#39;octubre</p>\r\n\r\n<p>Els servicis t&egrave;cnics
        competents de l&#39;Ajuntament segons la mat&egrave;ria, realitzaran un estudi
        de viabilitat de les propostes que hagen superat la fase anterior. S&#39;emetr&agrave;
        un informe de cada proposta, de manera individual o agrupant diverses propostes,
        indicant la viabilitat o inviabilitat justificada de la mateixa i el pressupost
        estimat en cas de viabilitat.</p>\r\n\r\n<p><strong>4. Votaci&oacute; ciutadana</strong><br
        />\r\nDel 10 d&#39;octubre al 7 de novembre</p>\r\n\r\n<p>Totes les persones
        majors de 16 anys empadronades a Val&egrave;ncia podran votar els diferents
        projectes en funci&oacute; del pressupost assignat.</p>\r\n\r\n<p><img alt=\"Calendari
        amb setmanes acolorides segons les quatre fases\" src=\"consul-seed://blob/oyia6fgywm62lwd2jxhrnup02ptz?variant=eyJmb3JtYXQiOiJwbmciLCJyZXNpemUiOiI4MDBcdTAwM2UifQ\"
        style=\"width: 800px; height: 380px;\" /></p>\r\n\r\n<h3>Com participar en
        els Pressupostos Participatius d&#39;Inversions?</h3>\r\n\r\n<p>Les ve&iuml;nes
        i els ve&iuml;ns de la ciutat poden participar de les seg&uuml;ents maneres:</p>\r\n\r\n<ol>\r\n\t<li>Proposant
        projectes d&#39;inversi&oacute;</li>\r\n\t<li>Donant suport als projectes
        presentats</li>\r\n\t<li>Votant</li>\r\n</ol>\r\n\r\n<h3>Distribuci&oacute;
        pressupost&agrave;ria de les propostes d&#39;inversi&oacute;</h3>\r\n\r\n<p>El
        pressupost vinculat a VLCParticipa es destinar&agrave; a realitzar projectes
        d&#39;inversi&oacute; localitzats en els districtes de la ciutat de Val&egrave;ncia,
        per la qual cosa cada districte tindr&agrave; assignada una quantia pressupost&agrave;ria,
        repartida segons criteris de poblaci&oacute; i indicadors socioecon&ograve;mics,
        segons la informaci&oacute; de l&#39;Oficina Municipal d&#39;Estad&iacute;stica.</p>\r\n\r\n<p>El
        c&agrave;lcul de la distribuci&oacute; dels pressupostos es realitzar&agrave;
        assignant una quantitat inicial fixa a cada un dels districtes i aplicant
        criteris de poblaci&oacute; (nombre de persones empadronades i renda).</p>\r\n\r\n<table>\r\n\t<thead>\r\n\t\t<tr>\r\n\t\t\t<th>\r\n\t\t\t<p>Districte</p>\r\n\t\t\t</th>\r\n\t\t\t<th>\r\n\t\t\t<p>Pressupost</p>\r\n\t\t\t</th>\r\n\t\t</tr>\r\n\t</thead>\r\n\t<tbody>\r\n\t\t<tr>\r\n\t\t\t<td>\r\n\t\t\t<p>Ciutat
        Vella</p>\r\n\t\t\t</td>\r\n\t\t\t<td>395.154</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>\r\n\t\t\t<p>l&#39;Eixample</p>\r\n\t\t\t</td>\r\n\t\t\t<td>485.894</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>\r\n\t\t\t<p>Extramurs</p>\r\n\t\t\t</td>\r\n\t\t\t<td>640.588</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>\r\n\t\t\t<p>Campanar</p>\r\n\t\t\t</td>\r\n\t\t\t<td>623.387</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>\r\n\t\t\t<p>la
        Sa&iuml;dia</p>\r\n\t\t\t</td>\r\n\t\t\t<td>921.957</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>\r\n\t\t\t<p>el
        Pla del Real</p>\r\n\t\t\t</td>\r\n\t\t\t<td>380.571</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>\r\n\t\t\t<p>l&#39;Olivereta</p>\r\n\t\t\t</td>\r\n\t\t\t<td>1.183.678</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>\r\n\t\t\t<p>Patraix</p>\r\n\t\t\t</td>\r\n\t\t\t<td>1.012.058</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>\r\n\t\t\t<p>Jes&uacute;s</p>\r\n\t\t\t</td>\r\n\t\t\t<td>1.157.550</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>\r\n\t\t\t<p>Quatre
        Carreres</p>\r\n\t\t\t</td>\r\n\t\t\t<td>1.475.031</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>\r\n\t\t\t<p>Poblats
        Mar&iacute;tims</p>\r\n\t\t\t</td>\r\n\t\t\t<td>1.205.469</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>\r\n\t\t\t<p>Camins
        al Grau</p>\r\n\t\t\t</td>\r\n\t\t\t<td>1.098.609</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>\r\n\t\t\t<p>Algir&oacute;s</p>\r\n\t\t\t</td>\r\n\t\t\t<td>586.341</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>\r\n\t\t\t<p>Benimaclet</p>\r\n\t\t\t</td>\r\n\t\t\t<td>510.618</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>\r\n\t\t\t<p>Rascanya</p>\r\n\t\t\t</td>\r\n\t\t\t<td>1.256.663</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>\r\n\t\t\t<p>Benicalap</p>\r\n\t\t\t</td>\r\n\t\t\t<td>1.103.863</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>\r\n\t\t\t<p>Pobles
        del Nord</p>\r\n\t\t\t</td>\r\n\t\t\t<td>373.506</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>\r\n\t\t\t<p>Pobles
        de l&#39;Oest</p>\r\n\t\t\t</td>\r\n\t\t\t<td>692.676</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>\r\n\t\t\t<p>Pobles
        del Sud</p>\r\n\t\t\t</td>\r\n\t\t\t<td>896.387</td>\r\n\t\t</tr>\r\n\t</tbody>\r\n</table>\r\n\r\n<h3><br
        />\r\nCompromisos del Govern Municipal</h3>\r\n\r\n<p>El Govern Municipal
        es compromet a dur a terme l&#39;execuci&oacute; d&#39;este gasto tenint en
        compte els resultats de VLCParticipa, sempre que s&#39;atenga els criteris
        t&egrave;cnics de viabilitat dels projectes i als l&iacute;mits econ&ograve;mics
        disponibles. D&#39;esta manera, els compromisos assumits es concreten en:</p>\r\n\r\n<ol>\r\n\t<li>Informar
        i assessorar la ciutadania al voltant del proc&eacute;s de VLCParticipa, les
        propostes presentades i la manera de secundar-les i votar-les.</li>\r\n\t<li>Convertir
        en projectes les propostes ciutadanes aprovades.</li>\r\n\t<li>Per part del
        Servici responsable de l&#39;execuci&oacute; de cada proposta, dotar de pressupost
        a les propostes que se li assignen i, si &eacute;s el cas, realitzar la previsi&oacute;
        del pressupost necessari per als exercicis seg&uuml;ents fins a la seua finalitzaci&oacute;.</li>\r\n\t<li>Facilitar
        el seguiment de l&#39;execuci&oacute; de les propostes a trav&eacute;s de
        la plataforma web.</li>\r\n\t<li>Incloure els projectes guanyadors en l&#39;avantprojecte
        del Pressupost General de l&#39;Ajuntament de Val&egrave;ncia.</li>\r\n</ol>\r\n"
