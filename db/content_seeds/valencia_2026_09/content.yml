        de ejecuci&oacute;n actual</th>\r\n\t\t\t<th>Porcentaje desarrollado</th>\r\n\t\t</tr>\r\n\t</thead>\r\n</table>\r\n\r\n<p><strong>DESCRIPCI&Oacute;N
        DE LAS FASES DE LOS PROYECTOS (*)</strong></p>\r\n\r\n<p>Los proyectos aprobados
        pasan por distintas fases en su ejecuci&oacute;n desde la redacci&oacute;n
        t&eacute;cnica de la propuesta hasta su finalizaci&oacute;n. Las fases son:</p>\r\n\r\n<p><strong>Redacci&oacute;n:</strong>&nbsp;El
        &aacute;rea municipal responsable de la ejecuci&oacute;n del proyecto est&aacute;
        realizando el estudio de detalle o realizando el proyecto t&eacute;cnico correspondiente.</p>\r\n\r\n<p><strong>Tramitaci&oacute;n:</strong>&nbsp;El
        proyecto t&eacute;cnico se encuentra en fase de gesti&oacute;n administrativa.
        Si es un contrato menor lo tramita la unidad que ejecuta el proyecto, sino
        se encuentra en el servicio transversal de contrataci&oacute;n</p>\r\n\r\n<p><strong>Ejecuci&oacute;n:</strong>&nbsp;El
        proyecto se encuentra en fase de ejecuci&oacute;n.</p>\r\n\r\n<p><strong>Ejecutado:</strong>&nbsp;El
        proyecto ha sido ejecutado y se ha finalizado.</p>\r\n"
