  translations:
    es:
      title: Accesibilidad
      subtitle: ''
      content: "<p>La accesibilidad web se refiere a la posibilidad de acceso a la
        web y a sus contenidos por todas las personas, independientemente de las discapacidades
        (f&iacute;sicas, intelectuales o t&eacute;cnicas) que puedan presentar o de
        las que se deriven del contexto de uso (tecnol&oacute;gicas o ambientales).</p>\r\n\r\n<p>Cuando
        los sitios web est&aacute;n dise&ntilde;ados pensando en la accesibilidad,
        todos los usuarios pueden acceder en condiciones de igualdad a los contenidos,
        por ejemplo:</p>\r\n\r\n<ul>\r\n\t<li>Proporcionando un texto alternativo
        a las im&aacute;genes, los usuarios invidentes o con problemas de visi&oacute;n
        pueden utilizar lectores especiales para acceder a la informaci&oacute;n.</li>\r\n\t<li>Cuando
        los v&iacute;deos disponen de subt&iacute;tulos, los usuarios con dificultades
        auditivas pueden entenderlos plenamente.</li>\r\n\t<li>Si los contenidos est&aacute;n
        escritos en un lenguaje sencillo e ilustrados, los usuarios con problemas
        de aprendizaje est&aacute;n en mejores condiciones de entenderlos.</li>\r\n\t<li>Si
        el usuario tiene problemas de movilidad y le cuesta usar el rat&oacute;n,
        las alternativas con el teclado le ayudan en la navegaci&oacute;n.</li>\r\n</ul>\r\n\r\n<h3>&quot;Atajos&quot;
        de teclado</h3>\r\n\r\n<p>Para poder navegar por este sitio web de forma accesible,
        se han programado un grupo de teclas de acceso r&aacute;pido que recogen las
        principales secciones de inter&eacute;s general en los que est&aacute; organizado
        el sitio.</p>\r\n\r\n<table>\r\n\t<caption>Atajos de teclado para el men&uacute;
        de navegaci&oacute;n</caption>\r\n\t<thead>\r\n\t\t<tr>\r\n\t\t\t<th scope=\"col\">Tecla</th>\r\n\t\t\t<th
        scope=\"col\">P&aacute;gina</th>\r\n\t\t</tr>\r\n\t</thead>\r\n\t<tbody>\r\n\t\t<tr>\r\n\t\t\t<td>0</td>\r\n\t\t\t<td>Inicio</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>1</td>\r\n\t\t\t<td>Debates</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>2</td>\r\n\t\t\t<td>Propuestas</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>3</td>\r\n\t\t\t<td>Votaciones</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>4</td>\r\n\t\t\t<td>Presupuestos
        participativos</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>5</td>\r\n\t\t\t<td>Procesos
        legislativos</td>\r\n\t\t</tr>\r\n\t</tbody>\r\n</table>\r\n\r\n<p>Dependiendo
        del sistema operativo y del navegador que se utilice, la combinaci&oacute;n
        de teclas ser&aacute; la siguiente:</p>\r\n\r\n<table>\r\n\t<caption>Combinaci&oacute;n
        de teclas dependiendo del sistema operativo y navegador</caption>\r\n\t<thead>\r\n\t\t<tr>\r\n\t\t\t<th
        scope=\"col\">Navegador</th>\r\n\t\t\t<th scope=\"col\">Combinaci&oacute;n
        de teclas</th>\r\n\t\t</tr>\r\n\t</thead>\r\n\t<tbody>\r\n\t\t<tr>\r\n\t\t\t<td>Explorer</td>\r\n\t\t\t<td>ALT
        + atajo y luego ENTER</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>Firefox</td>\r\n\t\t\t<td>ALT
        + MAY&Uacute;SCULAS + atajo</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>Chrome</td>\r\n\t\t\t<td>ALT
        + atajo (si es un MAC, CTRL + ALT + atajo)</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>Safari</td>\r\n\t\t\t<td>ALT
        + atajo (si es un MAC, CMD + atajo)</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>Opera</td>\r\n\t\t\t<td>MAY&Uacute;SCULAS
        + ESC + atajo</td>\r\n\t\t</tr>\r\n\t</tbody>\r\n</table>\r\n\r\n<h3>Tama&ntilde;o
        del texto</h3>\r\n\r\n<p>El dise&ntilde;o accesible de este sitio web permite
        que el usuario pueda elegir el tama&ntilde;o del texto que le convenga. Esta
        acci&oacute;n puede llevarse a cabo de diferentes maneras seg&uacute;n el
        navegador que se utilice.</p>\r\n\r\n<table>\r\n\t<thead>\r\n\t\t<tr>\r\n\t\t\t<th
        scope=\"col\">Navegador</th>\r\n\t\t\t<th scope=\"col\">Acci&oacute;n a realizar</th>\r\n\t\t</tr>\r\n\t</thead>\r\n\t<tbody>\r\n\t\t<tr>\r\n\t\t\t<td>Explorer</td>\r\n\t\t\t<td>Ver
        &gt; Tama&ntilde;o del texto</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>Firefox</td>\r\n\t\t\t<td>Ver
        &gt; Tama&ntilde;o</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>Chrome</td>\r\n\t\t\t<td>Ajustes
        (icono) &gt; Opciones &gt; Avanzada &gt; Contenido web &gt; Tama&ntilde;o
        fuente</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>Safari</td>\r\n\t\t\t<td>Visualizaci&oacute;n
        &gt; ampliar/reducir</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>Opera</td>\r\n\t\t\t<td>Ver
        &gt; escala</td>\r\n\t\t</tr>\r\n\t</tbody>\r\n</table>\r\n\r\n<p>Otra forma
        de modificar el tama&ntilde;o de texto es utilizar los atajos de teclado definidos
        en los navegadores, en particular la combinaci&oacute;n de teclas:</p>\r\n\r\n<ul>\r\n\t<li><code>CTRL
        y + (CMD y + en MAC)</code>&nbsp;para aumentar el tama&ntilde;o del texto</li>\r\n\t<li><code>CTRL
        y - (CMD y - en MAC)</code>&nbsp;para reducir el tama&ntilde;o del texto</li>\r\n</ul>\r\n\r\n<h3>Compatibilidad
        con est&aacute;ndares y dise&ntilde;o visual</h3>\r\n\r\n<p>Todas las p&aacute;ginas
        de este sitio web cumplen con las&nbsp;<strong>Pautas de Accesibilidad</strong>&nbsp;o
        Principios Generales de Dise&ntilde;o Accesible establecidas por el Grupo
        de Trabajo&nbsp;<abbr lang=\"en\" title=\"Web Accessibility Initiative\">WAI</abbr>&nbsp;perteneciente
        al W3C.</p>\r\n"
    val:
      title: Accessibilitat
      subtitle: ''
      content: "<p>La accesibilidad web se refiere a la posibilidad de acceso a la
        web y a sus contenidos por todas las personas, independientemente de las discapacidades
        (f&iacute;sicas, intelectuales o t&eacute;cnicas) que puedan presentar o de
        las que se deriven del contexto de uso (tecnol&oacute;gicas o ambientales).</p>\r\n\r\n<p>Cuando
        los sitios web est&aacute;n dise&ntilde;ados pensando en la accesibilidad,
        todos los usuarios pueden acceder en condiciones de igualdad a los contenidos,
        por ejemplo:</p>\r\n\r\n<ul>\r\n\t<li>Proporcionando un texto alternativo
        a las im&aacute;genes, los usuarios invidentes o con problemas de visi&oacute;n
        pueden utilizar lectores especiales para acceder a la informaci&oacute;n.</li>\r\n\t<li>Cuando
        los v&iacute;deos disponen de subt&iacute;tulos, los usuarios con dificultades
        auditivas pueden entenderlos plenamente.</li>\r\n\t<li>Si los contenidos est&aacute;n
        escritos en un lenguaje sencillo e ilustrados, los usuarios con problemas
        de aprendizaje est&aacute;n en mejores condiciones de entenderlos.</li>\r\n\t<li>Si
        el usuario tiene problemas de movilidad y le cuesta usar el rat&oacute;n,
        las alternativas con el teclado le ayudan en la navegaci&oacute;n.</li>\r\n</ul>\r\n\r\n<h3>Atalls
        de teclat</h3>\r\n\r\n<p>Para poder navegar por este sitio web de forma accesible,
        se han programado un grupo de teclas de acceso r&aacute;pido que recogen las
        principales secciones de inter&eacute;s general en los que est&aacute; organizado
        el sitio.</p>\r\n\r\n<table>\r\n\t<caption>Atajos de teclado para el men&uacute;
        de navegaci&oacute;n</caption>\r\n\t<thead>\r\n\t\t<tr>\r\n\t\t\t<th scope=\"col\">Clau</th>\r\n\t\t\t<th
        scope=\"col\">P&agrave;gina</th>\r\n\t\t</tr>\r\n\t</thead>\r\n\t<tbody>\r\n\t\t<tr>\r\n\t\t\t<td>0</td>\r\n\t\t\t<td>Inici</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>1</td>\r\n\t\t\t<td>Debats</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>2</td>\r\n\t\t\t<td>Propostes</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>3</td>\r\n\t\t\t<td>Vots</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>4</td>\r\n\t\t\t<td>Pressupostos
        participatius</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>5</td>\r\n\t\t\t<td>Processos
        legislatius</td>\r\n\t\t</tr>\r\n\t</tbody>\r\n</table>\r\n\r\n<p>Dependiendo
        del sistema operativo y del navegador que se utilice, la combinaci&oacute;n
        de teclas ser&aacute; la siguiente:</p>\r\n\r\n<table>\r\n\t<caption>Combinaci&oacute;n
        de teclas dependiendo del sistema operativo y navegador</caption>\r\n\t<thead>\r\n\t\t<tr>\r\n\t\t\t<th
        scope=\"col\">Navegador</th>\r\n\t\t\t<th scope=\"col\">Combinaci&oacute;
        de tecles</th>\r\n\t\t</tr>\r\n\t</thead>\r\n\t<tbody>\r\n\t\t<tr>\r\n\t\t\t<td>Explorer</td>\r\n\t\t\t<td>ALT
        + Atall i ENTER</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>Firefox</td>\r\n\t\t\t<td>ALT
        + May&uacute;s + Atall</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>Chrome</td>\r\n\t\t\t<td>ALT
        + atall (CTRL + ALT + atalls per a MAC)</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>Safari</td>\r\n\t\t\t<td>&nbsp;</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>Opera</td>\r\n\t\t\t<td>&nbsp;</td>\r\n\t\t</tr>\r\n\t</tbody>\r\n</table>\r\n\r\n<h3>Tamany
        del text</h3>\r\n\r\n<p>El dise&ntilde;o accesible de este sitio web permite
        que el usuario pueda elegir el tama&ntilde;o del texto que le convenga. Esta
        acci&oacute;n puede llevarse a cabo de diferentes maneras seg&uacute;n el
        navegador que se utilice.</p>\r\n\r\n<table>\r\n\t<thead>\r\n\t\t<tr>\r\n\t\t\t<th
        scope=\"col\">Navegador</th>\r\n\t\t\t<th scope=\"col\">Acci&oacute; a realitzar</th>\r\n\t\t</tr>\r\n\t</thead>\r\n\t<tbody>\r\n\t\t<tr>\r\n\t\t\t<td>Explorer</td>\r\n\t\t\t<td>Veure
        &gt; Tamany del text</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>Firefox</td>\r\n\t\t\t<td>Veure
        &gt; Tamany</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>Chrome</td>\r\n\t\t\t<td>&nbsp;</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>Safari</td>\r\n\t\t\t<td>&nbsp;</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>Opera</td>\r\n\t\t\t<td>Veure
        &gt; escala</td>\r\n\t\t</tr>\r\n\t</tbody>\r\n</table>\r\n\r\n<p>Otra forma
        de modificar el tama&ntilde;o de texto es utilizar los atajos de teclado definidos
        en los navegadores, en particular la combinaci&oacute;n de teclas:</p>\r\n\r\n<ul>\r\n\t<li>Incrementa
        el tamany del text</li>\r\n\t<li>Redu&iuml;x el tamany del text</li>\r\n</ul>\r\n\r\n<h3>Compatibilidad
        con est&aacute;ndares y dise&ntilde;o visual</h3>\r\n\r\n<p>Todas las p&aacute;ginas
        de este sitio web cumplen con las&nbsp;<strong>Pautas de Accesibilidad</strong>&nbsp;o
        Principios Generales de Dise&ntilde;o Accesible establecidas por el Grupo
        de Trabajo&nbsp;<abbr lang=\"en\" title=\"Web Accessibility Initiative\">WAI</abbr>&nbsp;perteneciente
        al W3C.</p>\r\n"
