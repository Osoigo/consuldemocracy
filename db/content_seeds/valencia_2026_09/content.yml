- slug: fase-de-analisis
  status: published
  more_info_flag: true
  print_content_flag: false
  locale:
  translations:
    es:
      title: Fase de análisis
      subtitle: ''
      content: "<p>En esta fase, los servicios competentes del Ayuntamiento realizar&aacute;n
        un estudio de viabilidad de las propuestas de inversi&oacute;n. La valoraci&oacute;n
        de las propuestas de propuestas de inversi&oacute;n se realizar&aacute; en
        un &uacute;nico proceso que consta de dos fases:</p>\r\n\r\n<h3>Validaci&oacute;n
        de las propuestas de proyectos de inversi&oacute;n</h3>\r\n\r\n<p>La validaci&oacute;n
        de las propuestas de proyectos de inversi&oacute;n ser&aacute; competencia
        del Servicio de Descentralizaci&oacute;n y Participaci&oacute;n Ciudadana
        del Ayuntamiento de Val&egrave;ncia, al objeto de garantizar el cumplimiento
        de las Directrices para el desarrollo de los presupuestos participativos &ldquo;VLCParticipa&rdquo;.</p>\r\n\r\n<p>Este
        proceso de validaci&oacute;n consistir&aacute; en la estimaci&oacute;n o desestimaci&oacute;n
        motivada de las propuestas de proyectos de inversi&oacute;n que se hayan presentado,
        teniendo en cuenta los requisitos que han de cumplir las propuestas de proyectos
        de inversi&oacute;n.</p>\r\n\r\n<p>Ser&aacute;n motivos de desestimaci&oacute;n:</p>\r\n\r\n<ol>\r\n\t<li>No
        contar con el apoyo m&iacute;nimo, seg&uacute;n los criterios de corte establecidos,
        por parte de las vecinas y vecinos de la ciudad.</li>\r\n\t<li>No ser un proyecto
        de inversi&oacute;n.</li>\r\n\t<li>No ser competencia municipal.</li>\r\n\t<li>Que
        para su ejecuci&oacute;n sea necesario implicar a otras administraciones p&uacute;blicas.</li>\r\n\t<li>Que
        el &aacute;mbito de aplicaci&oacute;n no sea municipal.</li>\r\n\t<li>Que
        su coste aproximado supere la partida presupuestaria.</li>\r\n\t<li>Que su
        ejecuci&oacute;n ya est&eacute; prevista y presupuestada por el Ayuntamiento
        de Valencia.</li>\r\n\t<li>Que exista m&aacute;s de una propuesta de proyecto
        referida a la misma demanda. En este caso podr&aacute;n agruparse.</li>\r\n\t<li>Que
        no se respete el principio de igualdad y no discriminaci&oacute;n en su formulaci&oacute;n.</li>\r\n\t<li>Que
        su ejecuci&oacute;n vulnere los derechos fundamentales o incremente la situaci&oacute;n
        de fragilidad social de la poblaci&oacute;n m&aacute;s desfavorecida de la
        ciudad.</li>\r\n\t<li>Que hayan sido declaradas inviables en ocasiones anteriores
        previas sin que las circunstancias hayan variado.</li>\r\n\t<li>Otros (este
        &iacute;tem siempre ser&aacute; motivado).</li>\r\n</ol>\r\n\r\n<h3>Viabilidad
        t&eacute;cnica de las propuestas de proyectos de inversi&oacute;n</h3>\r\n\r\n<p>Las
        propuestas de proyectos de inversi&oacute;n que se valoren como v&aacute;lidas
        pasar&aacute;n a ser estudiadas por los Servicios T&eacute;cnicos del Ayuntamiento
        de Val&egrave;ncia responsables de su ejecuci&oacute;n, que ser&aacute;n quienes
        emitan informe sobre su viabilidad jur&iacute;dica, t&eacute;cnica y/o presupuestaria.</p>\r\n\r\n<p>Todos
        los estudios de viabilidad ser&aacute;n realizados por personal t&eacute;cnico
        del Ayuntamiento, de manera independiente y neutral.</p>\r\n\r\n<p>S&oacute;lo
        se considerar&aacute;n viables aquellas propuestas de proyectos de inversi&oacute;n
        que cuenten con el informe favorable de los Servicios T&eacute;cnicos del
        Ayuntamiento, y &eacute;stas ser&aacute;n las que, en &uacute;ltima instancia,
        se elevar&aacute;n al proceso de votaci&oacute;n ciudadana.</p>\r\n\r\n<p>Para
        que los Servicios T&eacute;cnicos del Ayuntamiento informen la propuesta como
        viable:</p>\r\n\r\n<ol>\r\n\t<li>Estimar&aacute;n el coste de la propuesta,
        ya que ser&aacute;n excluidas todas las propuestas con un presupuesto superior
        a la cuant&iacute;a econ&oacute;mica asignada para su ejecuci&oacute;n en
        el distrito.</li>\r\n\t<li>Comprobar&aacute;n que la propuesta sea competencia
        del Ayuntamiento, ya que este puede asumir una serie de gastos, pero otros
        dependen de la Comunidad Aut&oacute;noma o del Estado.</li>\r\n\t<li>Estudiar&aacute;n
        si hay alguna normativa que impida llevar a cabo la propuesta, o si atenta
        contra el bien com&uacute;n.</li>\r\n\t<li>Valorar&aacute;n si es una inversi&oacute;n,
        seg&uacute;n los cap&iacute;tulos del presupuesto del Ayuntamiento. Dado que
        el presupuesto de los Presupuestos Participativos ha de estar destinado a
        inversiones, la propuesta tiene que encajar como gasto de inversi&oacute;n.</li>\r\n\t<li>Estudiar&aacute;n
        si la propuesta es viable t&eacute;cnicamente y no se prev&eacute; alg&uacute;n
        impedimento para llevarla a cabo, principalmente que su ejecuci&oacute;n no
        se extienda m&aacute;s all&aacute; de dos ejercicios presupuestarios y que
        no entre en conflicto o contradicci&oacute;n con planes o proyectos estrat&eacute;gicos
        ya definidos para la ciudad.</li>\r\n</ol>\r\n\r\n<p>El coste de la propuesta
        que valoren los Servicios T&eacute;cnicos del Ayuntamiento es estimativo,
        por lo que la asignaci&oacute;n final en el reparto econ&oacute;mico podr&aacute;
        variar hasta un 15% para poder cuadrar el presupuesto asignado a cada distrito.</p>\r\n"
- slug: fase-de-priorizacion
  status: published
  more_info_flag: true
  print_content_flag: false
  locale:
  translations:
    es:
      title: Fase de priorización
      subtitle: ''
      content: "<p>Esta fase consiste en dar apoyos a las propuestas de proyectos
        de inversi&oacute;n presentadas. Las propuestas necesitar&aacute;n el apoyo
        ciudadano para ser evaluadas por los Servicios T&eacute;cnicos Municipales
        y seguir adelante en el proceso: al menos 30 apoyos en los distritos y 15
        en las pedan&iacute;as (Pobles del Nord, Pobles Benim&agrave;met-Beniferri
        y Pobles del Sud) para pasar a la siguiente fase.</p>\r\n\r\n<p>Las propuestas
        de proyectos de inversi&oacute;n se podr&aacute;n apoyar v&iacute;a telem&aacute;tica,
        a trav&eacute;s de la plataforma web.</p>\r\n\r\n<p>Transcurrida la fase de
        priorizaci&oacute;n, se publicar&aacute;n en la web los apoyos obtenidos por
        las propuestas, los criterios de corte considerados para pasar a la siguiente
        fase y el traslado de los mismos para su an&aacute;lisis de viabilidad t&eacute;cnica.</p>\r\n"
    val:
      title: Fase de priorització
      subtitle: ''
      content: "<p>Esta fase consistix a donar suports a les propostes de projectes
        d&#39;inversi&oacute; presentades. Les propostes necessitaran el suport ciutad&agrave;
        per a ser avaluades pels Servicis T&egrave;cnics Municipals i seguir avant
        en el proc&eacute;s: almenys 30 suports en els districtes i 15 en les pedanies
        (Pobles del Nord, Pobles Benim&agrave;met-Beniferri i Pobles del Sud) per
        a passar a la seg&uuml;ent fase.</p>\r\n\r\n<p>Les propostes de projectes
        d&#39;inversi&oacute; es podran secundar via telem&agrave;tica, a trav&eacute;s
        de la plataforma web.</p>\r\n\r\n<p>Transcorreguda la fase de prioritzaci&oacute;,
        es publicaran en la web els suports obtinguts per les propostes, els criteris
        de tall considerats per a passar a la seg&uuml;ent fase i el trasllat dels
        mateixos per a la seua an&agrave;lisi de viabilitat t&egrave;cnica.</p>\r\n"
- slug: fase-de-proposicion-de-proyectos-de-inversion
  status: published
  more_info_flag: true
  print_content_flag: false
  locale:
  translations:
    es:
      title: Fase de proposición de proyectos de inversión
      subtitle: ''
      content: "<h3>Presentaci&oacute;n de propuestas por los Grupos de Trabajo de
        las Juntas Municipales de Distrito</h3>\r\n\r\n<p>Previamente a la fase de
        presentaci&oacute;n de propuestas, y a instancias de cada una de las personas
        coordinadoras de los Grupos de Trabajo en cada Junta Municipal de Distrito,
        o del Servicio de Descentralizaci&oacute;n y Participaci&oacute;n Ciudadana,
        los Grupos de Trabajo de las Juntas Municipales podr&aacute;n ser convocados
        al objeto de informar e impulsar los espacios necesarios de deliberaci&oacute;n,
        debate y propuesta de proyectos de inversi&oacute;n para los Presupuestos
        Participativos.</p>\r\n\r\n<p>Los Grupos de Trabajo de cada distrito ser&aacute;n
        dinamizados por sus coordinadores y coordinadoras. Funcionar&aacute;n de manera
        aut&oacute;noma, para que las propuestas puedan adaptarse a sus intereses,
        inquietudes y necesidades particulares. La finalidad del Grupo de Trabajo
        es la de promover el diagn&oacute;stico, debate y dise&ntilde;o colectivo
        de las propuestas de proyectos de inversi&oacute;n para sus distritos.</p>\r\n\r\n<p>Los
        Grupos de Trabajo ser&aacute;n asesorados por el Ayuntamiento, quien tambi&eacute;n
        podr&aacute; facilitar los lugares para su convocatoria y reuni&oacute;n para
        la presentaci&oacute;n de propuestas en VLCParticipa. Con ello se pretende
        propiciar el di&aacute;logo sobre las necesidades del distrito, recoger y
        fomentar las propuestas que vengan del tejido asociativo y un debate colectivo
        que fomente la cohesi&oacute;n y los v&iacute;nculos en los barrios y distritos,
        as&iacute; como los valores de la democracia participativa.</p>\r\n\r\n<p>Tanto
        las entidades como las personas a t&iacute;tulo individual pertenecientes
        a los Grupos de Trabajo, podr&aacute;n presentar sus propuestas de proyectos
        de inversi&oacute;n.</p>\r\n\r\n<p>El Grupo de Trabajo deber&aacute; orientar
        sus reuniones a la presentaci&oacute;n y deliberaci&oacute;n de propuestas
        por parte de las asociaciones y participantes y al consenso y trabajo colectivo
        sobre las mejores propuestas a presentar.</p>\r\n\r\n<p>Los Grupos de Trabajo
        podr&aacute;n presentar hasta 5 propuestas.</p>\r\n\r\n<p>Las propuestas de
        proyectos de inversi&oacute;n se presentar&aacute;n seg&uacute;n el proceso
        est&aacute;ndar establecido a tal efecto, y ser&aacute; el Servicio de Descentralizaci&oacute;n
        y Participaci&oacute;n Ciudadana el que habilitar&aacute; una etiqueta que
        identifique que dichas propuestas cuentan con el apoyo del Grupo de Trabajo
        de su distrito.</p>\r\n\r\n<p>Posteriormente a la fase de presentaci&oacute;n,
        estas propuestas pasar&aacute;n por el resto de fases anteriormente definidas
        y seguir&aacute;n el mismo proceso de apoyo, estudio de viabilidad y votaci&oacute;n
        que el resto de propuestas presentadas por la ciudadan&iacute;a.</p>\r\n\r\n<h3>Presentaci&oacute;n
        de propuestas por la ciudadan&iacute;a</h3>\r\n\r\n<p>Pueden presentar propuestas
        de proyectos de inversi&oacute;n todas las personas mayores de 16 a&ntilde;os
        empadronadas en la ciudad de Valencia en el momento de la inscripci&oacute;n
        en la web.</p>\r\n\r\n<p>Las propuestas de proyectos de inversi&oacute;n se
        presentar&aacute;n de forma individual o de forma colectiva, en representaci&oacute;n
        de entidades inscritas en el Registro de Entidades Ciudadanas de la ciudad
        de Val&egrave;ncia, pudiendo especificarlo as&iacute; en el propio texto de
        la propuesta.</p>\r\n\r\n<p>Se podr&aacute;n presentar hasta 3 propuestas
        de inversi&oacute;n. &Eacute;stas podr&aacute;n estar vinculadas a cualquier
        distrito.</p>\r\n\r\n<p>Las personas proponentes podr&aacute;n decidir en
        qu&eacute; distritos quieren realizar sus propuestas, en funci&oacute;n de
        sus intereses e inquietudes. Por tanto, podr&aacute;n implicarse en aqu&eacute;l
        donde est&aacute;n empadronadas, pero tambi&eacute;n en aquel donde trabajan,
        donde viven personas familiares o donde acuden sus hijas e hijos a la escuela,
        entre otros supuestos.</p>\r\n\r\n<p>Las propuestas de proyectos de inversi&oacute;n
        se podr&aacute;n presentar por v&iacute;a telem&aacute;tica, a trav&eacute;s
        de la plataforma web.</p>\r\n"
    val:
      title: Fase de proposició de projectes d'inversió
      subtitle: ''
      content: "<h3>Presentaci&oacute; de propostes pels Grups de Treball de les Juntes
        Municipals de Districte</h3>\r\n\r\n<p>Pr&egrave;viament a la fase de presentaci&oacute;
        de propostes, i a inst&agrave;ncies de cada una de les persones coordinadores
        dels Grups de Treball en cada Junta Municipal de Districte, o del Servici
        de Descentralitzaci&oacute; i Participaci&oacute; Ciutadana, els Grups de
        Treball de les Juntes Municipals podran ser convocats a fi d&#39;informar
        i impulsar els espais necessaris de deliberaci&oacute;, debat i proposta de
        projectes d&#39;inversi&oacute; per als Pressupostos Participatius.</p>\r\n\r\n<p>Els
        Grups de Treball de cada districte seran dinamitzats pels seus coordinadors
        i coordinadores. Funcionaran de manera aut&ograve;noma, perqu&egrave; les
        propostes puguen adaptar-se als seus interessos, inquietuds i necessitats
        particulars. La finalitat del Grup de Treball &eacute;s la de promoure el
        diagn&ograve;stic, debat i disseny col&middot;lectiu de les propostes de projectes
        d&#39;inversi&oacute; per als seus districtes.</p>\r\n\r\n<p>Els Grups de
        Treball seran assessorats per l&#39;Ajuntament, qui tamb&eacute; podr&agrave;
        facilitar els llocs per a la seua convocat&ograve;ria i reuni&oacute; per
        a la presentaci&oacute; de propostes en VLCParticipa. Amb aix&ograve; es pret&eacute;n
        propiciar el di&agrave;leg sobre les necessitats del districte, arreplegar
        i fomentar les propostes que vinguen del teixit associatiu i un debat col&middot;lectiu
        que fomente la cohesi&oacute; i els vincles en els barris i districtes, aix&iacute;
        com els valors de la democr&agrave;cia participativa.</p>\r\n\r\n<p>Tant les
        entitats com les persones a t&iacute;tol individual pertanyents als Grups
        de Treball, podran presentar les seues propostes de projectes d&#39;inversi&oacute;.</p>\r\n\r\n<p>El
        Grup de Treball haur&agrave; d&#39;orientar les seues reunions a la presentaci&oacute;
        i deliberaci&oacute; de propostes per part de les associacions i participants
        i al consens i treball col&middot;lectiu sobre les millors propostes a presentar.</p>\r\n\r\n<p>Els
        Grups de Treball podran presentar fins a 5 propostes.</p>\r\n\r\n<p>Les propostes
        de projectes d&#39;inversi&oacute; es presentaran segons el proc&eacute;s
        est&agrave;ndard establit a este efecte, i ser&agrave; el Servici de Descentralitzaci&oacute;
        i Participaci&oacute; Ciutadana el que habilitar&agrave; una etiqueta que
        identifique que estes propostes compten amb el suport del Grup de Treball
        del seu districte.</p>\r\n\r\n<p>Posteriorment a la fase de presentaci&oacute;,
        estes propostes passaran per la resta de fases anteriorment definides i seguiran
        el mateix proc&eacute;s de suport, estudi de viabilitat i votaci&oacute; que
        la resta de propostes presentades per la ciutadania.</p>\r\n\r\n<h3>Presentaci&oacute;
        de propostes per la ciutadania</h3>\r\n\r\n<p>Poden presentar propostes de
        projectes d&#39;inversi&oacute; totes les persones majors de 16 anys empadronades
        a la ciutat de Val&egrave;ncia en el moment de la inscripci&oacute; en la
        web.</p>\r\n\r\n<p>Les propostes de projectes d&#39;inversi&oacute; es presentaran
        de manera individual o de manera col&middot;lectiva, en representaci&oacute;
        d&#39;entitats inscrites en el Registre d&#39;Entitats Ciutadanes de la ciutat
        de Val&egrave;ncia, podent especificar-lo aix&iacute; en el propi text de
        la proposta.</p>\r\n\r\n<p>Es podran presentar fins a 3 propostes d&#39;inversi&oacute;.
        Estes podran estar vinculades a qualsevol districte.</p>\r\n\r\n<p>Les persones
        proponents podran decidir en quins districtes volen realitzar les seues propostes,
        en funci&oacute; dels seus interessos i inquietuds. Per tant, podran implicar-se
        en aquell on estan empadronades, per&ograve; tamb&eacute; en aquell on treballen,
        on viuen persones familiars o on acudixen les seues filles i fills a l&#39;escola,
        entre altres sup&ograve;sits.</p>\r\n\r\n<p>Les propostes de projectes d&#39;inversi&oacute;
        es podran presentar per via telem&agrave;tica a trav&eacute;s de la plataforma
        web.</p>\r\n"
- slug: fase-de-votacion-ciudadana
  status: published
  more_info_flag: true
  print_content_flag: false
  locale:
  translations:
    es:
      title: Fase de votación ciudadana
      subtitle: ''
      content: "<p>El proceso de votaci&oacute;n ciudadana de las propuestas de proyectos
        de inversi&oacute;n est&aacute; abierto a todas las personas mayores de 16
        a&ntilde;os empadronadas en la ciudad de Val&egrave;ncia.</p>\r\n\r\n<h3>&iquest;Qui&eacute;n
        puede votar?</h3>\r\n\r\n<p>Podr&aacute;n votar todas las personas mayores
        de 16 a&ntilde;os que est&eacute;n empadronadas en el municipio de Val&egrave;ncia
        en el momento de registrarse en la plataforma web o cuando se acuda a los
        &ldquo;Puntos de Votaci&oacute;n&rdquo; presenciales habilitados al efecto.
        Se publicar&aacute; informaci&oacute;n al respecto detallada sobre la votaci&oacute;n
        presencial.</p>\r\n\r\n<h3>&iquest;Qu&eacute; se puede votar?</h3>\r\n\r\n<p>Se
        podr&aacute;n votar &uacute;nicamente las propuestas de un s&oacute;lo distrito
        seg&uacute;n se establezca mediante Resoluci&oacute;n, quedando &eacute;ste
        a su libre elecci&oacute;n, que hayan sido valoradas como viables por los
        Servicios T&eacute;cnicos del Ayuntamiento de Val&egrave;ncia. El voto ser&aacute;
        individual e intransferible.</p>\r\n\r\n<p>Cada persona podr&aacute; ejercer
        su voto sobre aquellas propuestas de proyectos que hayan sido declaradas como
        viables en la fase anterior, que prefiera y crea que repercuten en el bien
        com&uacute;n o en la mejora de la calidad de vida, con la posibilidad de votar
        tambi&eacute;n en contra.</p>\r\n\r\n<p>El recuento final de los proyectos
        vencedores se realizar&aacute; calculando la diferencia entre votos a favor
        y votos en contra.</p>\r\n\r\n<p>Se publicar&aacute; el presupuesto disponible
        para cada uno de los distritos, as&iacute; como todas las propuestas de proyectos
        de inversi&oacute;n con su coste estimado. Por lo que se podr&aacute;n seleccionar
        propuestas hasta agotar el presupuesto asignado, otorg&aacute;ndole un voto
        a cada una.</p>\r\n\r\n<p>Se podr&aacute;n votar todas las propuestas que
        se estime oportuno mientras se tenga presupuesto disponible, aunque no ser&aacute;
        necesario gastarlo todo.</p>\r\n\r\n<h3>&iquest;C&oacute;mo y d&oacute;nde
        se puede votar?</h3>\r\n\r\n<p>La votaci&oacute;n se realizar&aacute; previo
        registro, de forma digital a trav&eacute;s de la plataforma web, desde cualquier
        dispositivo con acceso a internet.</p>\r\n\r\n<p>Adicionalmente se habilitar&aacute;n
        &ldquo;Puntos de Votaci&oacute;n&rdquo;, de los que se facilitar&aacute; informaci&oacute;n
        en la web, podr&aacute;n estar ubicados en determinadas oficinas municipales,
        como las Juntas Municipales de Distrito.</p>\r\n\r\n<p>La informaci&oacute;n
        sobre los &ldquo;Puntos de Votaci&oacute;n&rdquo; ser&aacute; publicada en
        la plataforma web en fechas pr&oacute;ximas a la fase de votaci&oacute;n.</p>\r\n\r\n<h3>Resultado
        de la votaci&oacute;n ciudadana</h3>\r\n\r\n<p>Una vez finalizada la votaci&oacute;n,
        se obtendr&aacute; el resultado final del proceso ordenando todas las propuestas
        de cada distrito en funci&oacute;n del n&uacute;mero de votos obtenidos.</p>\r\n\r\n<p>A
        continuaci&oacute;n, se ir&aacute; asignando el presupuesto disponible, empezando
        por seleccionar la propuesta m&aacute;s votada hasta la &uacute;ltima, teniendo
        en cuenta que cada propuesta incluida no supere el presupuesto restante destinado
        a dicha lista. Si una propuesta supera este l&iacute;mite, ser&aacute; descartada
        y se pasar&aacute; a seleccionar la siguiente.</p>\r\n\r\n<p>Si una propuesta
        supera dicho l&iacute;mite, se valorar&aacute; la posibilidad de que se pueda
        iniciar su ejecuci&oacute;n por fases, previo informe de los Servicios T&eacute;cnicos
        Municipales, y se destinar&iacute;a el presupuesto necesario para ello.</p>\r\n\r\n<p>Si
        salen elegidas dos propuestas que sean incompatibles entre s&iacute; (por
        la actuaci&oacute;n a llevar a cabo, o porque empaten en n&uacute;mero de
        votos no quedando presupuesto para realizar las dos), ser&aacute; seleccionada
        la que tenga mayor n&uacute;mero de votos.</p>\r\n\r\n<p>En caso de empate
        en votos, se estudiar&aacute;n, por parte del Servicio ejecutor y del Servicio
        de Descentralizaci&oacute;n y Participaci&oacute;n Ciudadana, las posibles
        soluciones y se publicar&aacute; un informe motivado al respecto.</p>\r\n"
    val:
      title: Fase de votació ciutadana
      subtitle: ''
      content: "<p>El proc&eacute;s de votaci&oacute; ciutadana de les propostes de
        projectes d&#39;inversi&oacute; est&agrave; obert a totes les persones majors
        de 16 anys empadronades a la ciutat de Val&egrave;ncia.</p>\r\n\r\n<h3>Qui
        pot votar?</h3>\r\n\r\n<p>Podran votar totes les persones majors de 16 anys
        que estiguen empadronades en el municipi de Val&egrave;ncia en el moment de
        registrar-se en la plataforma web o quan s&#39;acudisca als &ldquo;Punts de
        Votaci&oacute;&rdquo; presencials habilitats a este efecte. Es publicar&agrave;
        informaci&oacute; al respecte detallada sobre la votaci&oacute; presencial.</p>\r\n\r\n<h3>Qu&egrave;
        es pot votar?</h3>\r\n\r\n<p>Es podran votar &uacute;nicament les propostes
        d&#39;un &uacute;nic districte segons s&#39;establisca mitjan&ccedil;ant Resoluci&oacute;,
        quedant este a la seua lliure elecci&oacute;, que hagen sigut valorades com
        a viables pels Servicis T&egrave;cnics de l&#39;Ajuntament de Val&egrave;ncia.
        El vot ser&agrave; individual i intransferible.</p>\r\n\r\n<p>Cada persona
        podr&agrave; exercir el seu vot sobre aquelles propostes de projectes que
        hagen sigut declarades com a viables en la fase anterior, que preferisca i
        crega que repercutixen en el b&eacute; com&uacute; o en la millora de la qualitat
        de vida, amb la possibilitat de votar tamb&eacute; en contra.</p>\r\n\r\n<p>El
        recompte final dels projectes vencedors es realitzar&agrave; calculant la
        difer&egrave;ncia entre vots a favor i vots en contra.</p>\r\n\r\n<p>Es publicar&agrave;
        el pressupost disponible per a cada un dels districtes, aix&iacute; com totes
        les propostes de projectes d&#39;inversi&oacute; amb el seu cost estimat.
        Pel que es podran seleccionar propostes fins a esgotar el pressupost assignat,
        atorgant-li un vot a cada una.</p>\r\n\r\n<p>Es podran votar totes les propostes
        que s&#39;estime oport&uacute; mentres es tinga pressupost disponible, encara
        que no ser&agrave; necessari gastar-ho tot.</p>\r\n\r\n<h3>Com i on es pot
        votar?</h3>\r\n\r\n<p>La votaci&oacute; es realitzar&agrave; previ registre,
        de manera digital a trav&eacute;s de la plataforma web, des de qualsevol dispositiu
        amb acc&eacute;s a internet.</p>\r\n\r\n<p>Addicionalment s&#39;habilitaran
        &ldquo;Punts de Votaci&oacute;&rdquo;, dels quals es facilitar&agrave; informaci&oacute;
        en la web, podran estar situats en determinades oficines municipals, com les
        Juntes Municipals de Districte.</p>\r\n\r\n<p>La informaci&oacute; sobre els
        &ldquo;Punts de Votaci&oacute;&rdquo; ser&agrave; publicada en la plataforma
        web en dates pr&ograve;ximes a la fase de votaci&oacute;.</p>\r\n\r\n<h3>Resultat
        de la votaci&oacute; ciutadana</h3>\r\n\r\n<p>Una vegada finalitzada la votaci&oacute;,
        s&#39;obtindr&agrave; el resultat final del proc&eacute;s ordenant totes les
        propostes de cada districte en funci&oacute; del nombre de vots obtinguts.</p>\r\n\r\n<p>A
        continuaci&oacute;, s&#39;anir&agrave; assignant el pressupost disponible,
        comen&ccedil;ant per seleccionar la proposta m&eacute;s votada fins a l&#39;&uacute;ltima,
        tenint en compte que cada proposta inclosa no supere el pressupost restant
        destinat a esta llista. Si una proposta supera este l&iacute;mit, ser&agrave;
        descartada i es passar&agrave; a seleccionar la seg&uuml;ent.</p>\r\n\r\n<p>Si
        una proposta supera este l&iacute;mit, es valorar&agrave; la possibilitat
        que es puga iniciar la seua execuci&oacute; per fases, previ informe dels
        Servicis T&egrave;cnics Municipals, i es destinaria el pressupost necessari
        per a aix&ograve;.</p>\r\n\r\n<p>Si ixen triades dos propostes que siguen
        incompatibles entre si (per l&#39;actuaci&oacute; a dur a terme, o perqu&egrave;
        empaten en nombre de vots no quedant pressupost per a realitzar les dos),
        ser&agrave; seleccionada la que tinga major nombre de vots.</p>\r\n\r\n<p>En
        cas d&#39;empat en vots, s&#39;estudiaran, per part del Servici executor i
        del Servici de Descentralitzaci&oacute; i Participaci&oacute; Ciutadana, les
        possibles solucions i es publicar&agrave; un informe motivat al respecte.</p>\r\n"
